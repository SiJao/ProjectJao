<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>HISADA · Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Menu utama" style="width: 100%; min-height: 900px; background: #FFFFFF; border-right: 1px solid #DDE3DF; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; box-sizing: border-box">
  <a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 4px 8px; text-decoration: none; color: #18201C">
    <span style="width: 36px; height: 36px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700">H</span>
    <span style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 16px">HISADA</span><span style="font-size: 12px; color: #55605A">Putra · 2026/2027</span></span>
  </a>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6A64; padding: 0 10px 6px">{{ g.label }}</div>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
        <sc-if value="{{ it.live }}" hint-placeholder-val="{{ true }}">
          <a href="{{ it.href }}" style="{{ it.style }}">{{ it.label }}</a>
        </sc-if>
        <sc-if value="{{ it.soon }}" hint-placeholder-val="{{ false }}">
          <span style="display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-radius: 8px; font-size: 14px; color: #6B756F">{{ it.label }}<span style="font-size: 11px; border: 1px solid #DDE3DF; border-radius: 999px; padding: 1px 7px">nanti</span></span>
        </sc-if>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top: auto; border-top: 1px solid #DDE3DF; padding-top: 14px; display: flex; align-items: center; gap: 10px; padding-left: 8px">
    <span style="width: 34px; height: 34px; border-radius: 999px; background: #E3EFE8; color: #14533C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">SK</span>
    <span style="display: flex; flex-direction: column; font-size: 13px"><span style="font-weight: 600">Sekretaris (contoh)</span><a href="Main.dc.html" style="color: #1F6B4F">Keluar</a></span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","absensi","perizinan","kesehatan","kedisiplinan","datamaster","updatedata","akses","riwayat","pd","rapor","tw"],"default":"dashboard"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: block; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-decoration: none; ';
    const on = base + 'background: #E3EFE8; color: #14533C; font-weight: 600';
    const off = base + 'color: #2E3833';
    const mk = (key, label, href) => ({ label, href, live: !!href, soon: !href, style: key === active ? on : off });
    return {
      groups: [
        { label: 'Beranda', items: [mk('dashboard', 'Dashboard', 'Dashboard.dc.html')] },
        { label: 'Administrasi', items: [
          mk('datamaster', 'Data Master', 'DataMaster.dc.html'),
          mk('absensi', 'Absensi', 'Absensi.dc.html'),
          mk('perizinan', 'Perizinan', 'Perizinan.dc.html'),
          mk('kesehatan', 'Kesehatan', 'Kesehatan.dc.html'),
          mk('kedisiplinan', 'Kedisiplinan', 'Kedisiplinan.dc.html'),
          mk('pd', 'Pengembangan Diri', 'PengembanganDiri.dc.html'),
          mk('rapor', 'Rapor Kesantrian', 'Rapor.dc.html'),
          mk('tw', 'Tata Warkat', 'TataWarkat.dc.html')
        ] },
        { label: 'Fungsi', items: [
          mk('updatedata', 'Update Data & Import', 'UpdateData.dc.html'),
          mk('akses', 'Manajemen Akses', 'ManajemenAkses.dc.html'),
          mk('riwayat', 'Riwayat Perubahan', 'Riwayat.dc.html')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
