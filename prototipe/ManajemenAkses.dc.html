<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>HISADA · Manajemen Akses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#18201C}
*{box-sizing:border-box}
a{color:#1F6B4F}a:hover{color:#14533C}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; background: #F4F6F4">
  <div style="flex: 1 1 248px; max-width: 100%">
    <dc-import name="Sidebar" active="akses" hint-size="248px,900px"></dc-import>
  </div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #55605A">Fungsi › Akses</span>
        <h1 style="margin: 0; font-size: 28px; font-weight: 700">Manajemen Akses</h1>
      </div>
      <span style="font-size: 12px; color: #14533C; background: #E3EFE8; border-radius: 999px; padding: 5px 12px; font-weight: 600">Hanya Moderator</span>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <section style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 8px 0">
        <div style="padding: 12px 20px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 17px; font-weight: 700">Pengguna</h2>
          <input type="search" aria-label="Cari pengguna" placeholder="Cari nama, NIS, atau NIP" style="height: 42px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit">
        </div>
        <sc-for list="{{ users }}" as="u" hint-placeholder-count="5">
          <button type="button" onClick="{{ u.pick }}" style="{{ u.style }}">
            <span style="display: flex; flex-direction: column; gap: 2px; text-align: left"><span style="font-weight: 600">{{ u.nama }}</span><span style="font-size: 13px; color: #55605A">{{ u.id }}</span></span>
            <span style="font-size: 12px; font-weight: 700; color: #3B4540; background: #EEF1EF; border-radius: 999px; padding: 3px 10px; white-space: nowrap">{{ u.role }}</span>
          </button>
        </sc-for>
      </section>

      <section style="flex: 1.4 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 17px; font-weight: 700">{{ cur.nama }}</h2><span style="font-size: 13px; color: #55605A">{{ cur.id }}</span></div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Role (satu per pengguna)
          <select onChange="{{ pickRole }}" style="height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF">
            <sc-for list="{{ roles }}" as="r" hint-placeholder-count="6">
              <option value="{{ r.label }}" selected="{{ r.on }}" disabled="{{ r.off }}">{{ r.text }}</option>
            </sc-for>
          </select>
          <span style="font-weight: 400; color: #55605A">{{ roleNote }}</span>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Cakupan data
          <sc-if value="{{ cakupanPilih }}" hint-placeholder-val="{{ false }}">
            <select style="height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF"><option>Putra</option><option>Putri</option><option>Semua</option></select>
          </sc-if>
          <sc-if value="{{ cakupanTetap }}" hint-placeholder-val="{{ true }}">
            <span style="font-weight: 400; min-height: 44px; display: flex; align-items: center; padding: 0 12px; border: 1px dashed #C9D2CC; border-radius: 10px; color: #3B4540">{{ cakupanText }}</span>
          </sc-if>
        </label>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 600">Akses di luar role</span>
          <sc-for list="{{ perms }}" as="p" hint-placeholder-count="6">
            <label style="{{ p.rowStyle }}">
              <input type="checkbox" checked="{{ p.on }}" disabled="{{ p.locked }}" onChange="{{ p.toggle }}" style="width: 18px; height: 18px">
              <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{ p.label }}</span><span style="font-size: 12px; color: #55605A">{{ p.desc }}</span></span>
            </label>
          </sc-for>
        </div>
        <p style="margin: 0; font-size: 13px; color: #55605A; line-height: 1.5">Setiap pemberian atau pencabutan akses tercatat di Riwayat Perubahan dan diberitahukan ke pemilik akun lewat email.</p>
        <button type="button" style="height: 46px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; border: 0; font: inherit; font-weight: 600; cursor: pointer">Simpan akses</button>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, roleOf: {}, perms: { 0: { putusan: true }, 1: { perizinan: true }, 2: { kesehatan: true, absensi: true, profil_kesehatan: true, 'pilihan.obat': true }, 3: {}, 4: { input_pelanggaran: true, putusan: true }, 5: {} } };
  }
  renderVals() {
    // santri: akun pengurus (NIS) · guru: akun non-santri (NIP)
    const U = [
      { nama: '[Nama guru] · guru (hakim)', id: 'NIP 9002', role: 'Asatidz', jenis: 'guru' },
      { nama: 'Santri Contoh 61 · pengurus', id: 'NIS 990661', role: 'Piket', jenis: 'santri' },
      { nama: 'Santri Contoh 62 · pengurus', id: 'NIS 990662', role: 'Kesehatan', jenis: 'santri' },
      { nama: 'Santri Contoh 63 · pengurus', id: 'NIS 990663', role: 'Sekretaris', jenis: 'santri' },
      { nama: 'Santri Contoh 64 · pengurus', id: 'NIS 990664', role: 'Kedisiplinan', jenis: 'santri' },
      { nama: 'Admin pondok · tim IT', id: 'NIP 9000', role: 'Moderator', jenis: 'guru' }
    ];
    const ROLES = [['Piket', 'santri'], ['Kesehatan', 'santri'], ['Kedisiplinan', 'santri'], ['Sekretaris', 'santri'], ['Asatidz', 'guru'], ['Moderator', 'guru']];
    // [kode, label, keterangan, otomatis untuk role, hanya untuk role]
    const PL = [
      ['absensi', 'Absensi', 'Mengisi absensi harian / kegiatan', ['Piket', 'Sekretaris'], null],
      ['perizinan', 'Perizinan', 'Menerbitkan izin, Gate Pass, Libur Pondok', [], ['Piket']],
      ['kesehatan', 'Kesehatan', 'Membuka data kunjungan dan pemeriksaan', [], ['Kesehatan']],
      ['profil_kesehatan', 'Profil kesehatan', 'Mengedit alergi dan penyakit kronis', [], null],
      ['input_pelanggaran', 'Input pelanggaran', 'Mencatat pelanggaran santri (penginput)', [], null],
      ['putusan', 'Putusan kedisiplinan', 'Memvonis dan memutihkan (bukan kasus yang ia catat)', [], null],
      ['input_pelanggaran_pengurus', 'Input pelanggaran pengurus', 'Untuk guru pengasuhan', [], ['Asatidz']],
      ['penilaian', 'Penilaian kegiatan', 'Tahsin, muhadhoroh, ekstrakurikuler', [], null],
      ['pilihan.obat', 'Daftar pilihan · Obat', 'Mengedit daftar obat di Data Master', [], null],
      ['pilihan.diagnosa', 'Daftar pilihan · Diagnosa', 'Mengedit daftar diagnosa di Data Master', [], null]
    ];
    const s = this.state.sel;
    const u = U[s];
    const role = this.state.roleOf[s] || u.role;
    const mod = role === 'Moderator';
    const mine = this.state.perms[s] || {};
    const row = (dim) => 'display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 8px 12px; border: 1px solid #E6EBE8; border-radius: 10px; font-size: 14px; ' + (dim ? 'background: #F4F6F4; color: #6B756F; cursor: not-allowed' : 'cursor: pointer');
    return {
      users: U.map((x, i) => ({
        ...x, role: this.state.roleOf[i] || x.role,
        style: 'display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 20px; border: 0; border-top: 1px solid #EEF1EF; font: inherit; color: #18201C; cursor: pointer; ' + (i === s ? 'background: #EEF5F1' : 'background: #FFFFFF'),
        pick: () => this.setState({ sel: i })
      })),
      cur: u,
      roles: ROLES.map(([r, j]) => ({ label: r, on: r === role, off: j !== u.jenis, text: r + (j !== u.jenis ? (j === 'guru' ? ' — hanya akun non-santri' : ' — hanya akun santri') : '') })),
      pickRole: (e) => this.setState({ roleOf: { ...this.state.roleOf, [s]: e.target.value } }),
      roleNote: u.jenis === 'santri' ? 'Akun santri: Moderator dan Asatidz tidak tersedia.' : 'Akun non-santri (guru / pihak pondok).',
      cakupanPilih: role === 'Asatidz', cakupanTetap: role !== 'Asatidz',
      cakupanText: mod ? 'Semua lingkungan (Moderator)' : 'Putra — otomatis dari jenis kelamin santri',
      perms: PL.map(([k, label, desc, auto, only]) => {
        const otomatis = mod || auto.indexOf(role) >= 0;
        const terlarang = !otomatis && only && only.indexOf(role) < 0;
        const ket = otomatis ? (mod ? 'Moderator memegang semua akses' : 'otomatis dari role ' + role) : (terlarang ? 'hanya untuk role ' + only.join(' / ') : desc);
        return {
          label, desc: ket, on: otomatis || (!terlarang && !!mine[k]), locked: otomatis || terlarang, rowStyle: row(otomatis || terlarang),
          toggle: () => { if (!otomatis && !terlarang) this.setState({ perms: { ...this.state.perms, [s]: { ...mine, [k]: !mine[k] } } }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
