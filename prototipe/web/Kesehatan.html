<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HISADA · Kesehatan</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#18201C}
*{box-sizing:border-box}
a{color:#1F6B4F}a:hover{color:#14533C}
</style>
</head>
<body>
<div id="app"></div>
<script src="vue.global.prod.js"></script>
<script src="dc-shim.js"></script>
<script>
var DEFS = {};
DEFS["Kesehatan"] = { props: [], template: "<div style=\"display: flex; flex-wrap: wrap; min-height: 900px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; background: #F4F6F4\">\n  <div style=\"flex: 1 1 248px; max-width: 100%\">\n    <sidebar-c active=\"kesehatan\"></sidebar-c>\n  </div>\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n    <header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-size: 13px; color: #55605A\">Administrasi › Kesantrian</span>\n        <h1 style=\"margin: 0; font-size: 28px; font-weight: 700\">Kesehatan</h1>\n      </div>\n      <span style=\"font-size: 12px; color: #7A4E0C; background: #FBF0DC; border-radius: 999px; padding: 5px 12px; font-weight: 600\">Data medis · akses terbatas</span>\n    </header>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n      <section style=\"flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 8px 0; display: flex; flex-direction: column\">\n        <h2 style=\"margin: 0; font-size: 17px; font-weight: 700; padding: 12px 20px\">Kunjungan hari ini</h2>\n        <template v-for=\"(v, $index) in visits\">\n          <button type=\"button\" @click=\"v.pick\" :style=\"v.style\">\n            <span style=\"display: flex; flex-direction: column; gap: 2px; text-align: left\"><span style=\"font-weight: 600\">{{ v.nama }}</span><span style=\"font-size: 13px; color: #55605A\">{{ v.kamar }} · {{ v.keluhan }}</span></span>\n            <span :style=\"v.badge\">{{ v.jenis }}</span>\n          </button>\n        </template>\n      </section>\n\n      <section style=\"flex: 1.3 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 12px\">\n          <div style=\"display: flex; flex-direction: column; gap: 2px\"><h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Pemeriksaan · {{ sel.nama }}</h2><span style=\"font-size: 13px; color: #55605A\">{{ sel.kamar }} · keluhan: {{ sel.keluhan }}</span></div>\n        </div>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Jenis kunjungan\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n            <button type=\"button\" @click=\"setJalan\" :aria-pressed=\"isJalan\" :style=\"jalanStyle\">Rawat Jalan</button>\n            <button type=\"button\" @click=\"setRawat\" :aria-pressed=\"isRawat\" :style=\"rawatStyle\">Perawatan</button>\n          </div>\n          <span style=\"font-weight: 400; color: #55605A\">{{ jenisNote }}</span>\n        </div>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Diagnosa\n          <input type=\"text\" placeholder=\"Diisi dokter / pengurus jaga\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400\">\n        </label>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Resep\n          <textarea rows=\"3\" placeholder=\"Obat dan aturan pakai\" style=\"border: 1px solid #C9D2CC; border-radius: 10px; padding: 10px 12px; font: inherit; font-weight: 400; resize: vertical\"></textarea>\n        </label>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Tindak lanjut\n          <select style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Kembali ke kegiatan</option><option>Istirahat di kamar</option><option>Rujuk ke klinik / RS</option></select>\n        </label>\n        <div style=\"background: #EEF3EF; border: 1px solid #D5E2DA; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5; color: #3B4540\">Wali hanya menerima kabar \"sedang sakit / dirawat\", tanpa diagnosa.</div>\n        <button type=\"button\" style=\"height: 46px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; border: 0; font: inherit; font-weight: 600; cursor: pointer\">Simpan pemeriksaan</button>\n      </section>\n    </div>\n\n    <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center\"><h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Analisis musim sakit</h2><span style=\"font-size: 12px; color: #55605A\">kunjungan 6 bulan terakhir</span></div>\n      <div style=\"display: flex; align-items: flex-end; gap: 14px; height: 120px\" role=\"img\" aria-label=\"Kunjungan per bulan, Mei sampai Oktober\">\n        <template v-for=\"(m, $index) in months\">\n          <div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end\">\n            <span style=\"font-size: 12px; font-weight: 600\">{{ m.n }}</span>\n            <div :style=\"m.bar\"></div>\n            <span style=\"font-size: 12px; color: #55605A\">{{ m.label }}</span>\n          </div>\n        </template>\n      </div>\n    </section>\n  </main>\n</div>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, rawat: { 0: false, 1: true, 2: false, 3: true, 4: false } };
  }
  renderVals() {
    const V = [
      { nama: 'Santri Contoh 21', kamar: 'Ibnu Sina-03', keluhan: 'demam' },
      { nama: 'Santri Contoh 22', kamar: 'Ibnu Rusyd-01', keluhan: 'pusing, mual' },
      { nama: 'Santri Contoh 23', kamar: 'Kholid Bin Walid-05', keluhan: 'gatal kulit' },
      { nama: 'Santri Contoh 24', kamar: 'Ibnu Sina-01', keluhan: 'batuk pilek' },
      { nama: 'Santri Contoh 25', kamar: 'Bilal bin Rabah-02', keluhan: 'luka ringan' }
    ];
    const r = this.state.rawat;
    const s = this.state.sel;
    const badge = (on) => 'border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; ' + (on ? 'background: #FBF0DC; color: #7A4E0C' : 'background: #EEF1EF; color: #3B4540');
    const pill = (on) => 'height: 40px; border-radius: 999px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #1F6B4F; color: #FFFFFF; border: 1px solid #1F6B4F' : 'background: #FFFFFF; color: #2E3833; border: 1px solid #C9D2CC');
    const data = [18, 22, 15, 27, 34, 29];
    const max = 34;
    return {
      visits: V.map((v, i) => ({
        ...v, jenis: r[i] ? 'Perawatan' : 'Rawat Jalan', badge: badge(r[i]),
        style: 'display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 20px; border: 0; border-top: 1px solid #EEF1EF; font: inherit; color: #18201C; cursor: pointer; ' + (i === s ? 'background: #EEF5F1' : 'background: #FFFFFF'),
        pick: () => this.setState({ sel: i })
      })),
      sel: V[s], isRawat: !!r[s], isJalan: !r[s],
      rawatStyle: pill(!!r[s]), jalanStyle: pill(!r[s]),
      setRawat: () => this.setState({ rawat: { ...r, [s]: true } }),
      setJalan: () => this.setState({ rawat: { ...r, [s]: false } }),
      jenisNote: r[s] ? 'Absensi hari ini otomatis menjadi Sakit.' : 'Tidak mengubah absensi.',
      months: ['Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt'].map((label, i) => ({
        label, n: String(data[i]),
        bar: 'width: 100%; max-width: 56px; border-radius: 6px 6px 0 0; background: ' + (i === 4 ? '#1F6B4F' : '#A9CDB9') + '; height: ' + Math.round(data[i] / max * 80) + 'px'
      }))
    };
  }
}

return Component; })() };
DEFS["Sidebar"] = { props: ["active"], template: "<nav aria-label=\"Menu utama\" style=\"width: 100%; min-height: 900px; background: #FFFFFF; border-right: 1px solid #DDE3DF; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; box-sizing: border-box\">\n  <a href=\"Dashboard.html\" style=\"display: flex; align-items: center; gap: 10px; padding: 4px 8px; text-decoration: none; color: #18201C\">\n    <span style=\"width: 36px; height: 36px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700\">H</span>\n    <span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 700; font-size: 16px\">HISADA</span><span style=\"font-size: 12px; color: #55605A\">Putra · 2026/2027</span></span>\n  </a>\n  <template v-for=\"(g, $index) in groups\">\n    <div style=\"display: flex; flex-direction: column; gap: 2px\">\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6A64; padding: 0 10px 6px\">{{ g.label }}</div>\n      <template v-for=\"(it, $index) in g.items\">\n        <template v-if=\"it.live\">\n          <a :href=\"it.href\" :style=\"it.style\">{{ it.label }}</a>\n        </template>\n        <template v-if=\"it.soon\">\n          <span style=\"display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-radius: 8px; font-size: 14px; color: #6B756F\">{{ it.label }}<span style=\"font-size: 11px; border: 1px solid #DDE3DF; border-radius: 999px; padding: 1px 7px\">nanti</span></span>\n        </template>\n      </template>\n    </div>\n  </template>\n  <div style=\"margin-top: auto; border-top: 1px solid #DDE3DF; padding-top: 14px; display: flex; align-items: center; gap: 10px; padding-left: 8px\">\n    <span style=\"width: 34px; height: 34px; border-radius: 999px; background: #E3EFE8; color: #14533C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px\">SK</span>\n    <span style=\"display: flex; flex-direction: column; font-size: 13px\"><span style=\"font-weight: 600\">Sekretaris (contoh)</span><a href=\"index.html\" style=\"color: #1F6B4F\">Keluar</a></span>\n  </div>\n</nav>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: block; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-decoration: none; ';
    const on = base + 'background: #E3EFE8; color: #14533C; font-weight: 600';
    const off = base + 'color: #2E3833';
    const mk = (key, label, href) => ({ label, href, live: !!href, soon: !href, style: key === active ? on : off });
    return {
      groups: [
        { label: 'Beranda', items: [mk('dashboard', 'Dashboard', 'Dashboard.html')] },
        { label: 'Administrasi', items: [
          mk('datamaster', 'Data Master', 'DataMaster.html'),
          mk('absensi', 'Absensi', 'Absensi.html'),
          mk('perizinan', 'Perizinan', 'Perizinan.html'),
          mk('kesehatan', 'Kesehatan', 'Kesehatan.html'),
          mk('kedisiplinan', 'Kedisiplinan', 'Kedisiplinan.html'),
          mk('pd', 'Pengembangan Diri', 'PengembanganDiri.html'),
          mk('rapor', 'Rapor Kesantrian', 'Rapor.html'),
          mk('tw', 'Tata Warkat', 'TataWarkat.html')
        ] },
        { label: 'Fungsi', items: [
          mk('updatedata', 'Update Data & Import', 'UpdateData.html'),
          mk('akses', 'Manajemen Akses', 'ManajemenAkses.html'),
          mk('riwayat', 'Riwayat Perubahan', 'Riwayat.html')
        ] }
      ]
    };
  }
}

return Component; })() };
DCMount("Kesehatan", DEFS);
</script>
</body>
</html>
