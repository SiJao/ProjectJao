<!doctype html>
<html lang="id">
<head>

<title>HISADA · Pengembangan Diri</title>

<style>

*{box-sizing:border-box}

</style>
</head>
<body>
<div id="app"></div>
<script src="vue.global.prod.js"></script>
<script src="dc-shim.js"></script>
<script>
var DEFS = {};
DEFS["PengembanganDiri"] = { props: [], template: "<div style=\"display: flex; flex-wrap: wrap; min-height: 900px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; background: #F4F6F4\">\n  <div style=\"flex: 1 1 248px; max-width: 100%\">\n    <sidebar-c active=\"pd\"></sidebar-c>\n  </div>\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n    <header style=\"display: flex; flex-direction: column; gap: 4px\">\n      <span style=\"font-size: 13px; color: #55605A\">Administrasi › Kesantrian</span>\n      <h1 style=\"margin: 0; font-size: 28px; font-weight: 700\">Pengembangan Diri</h1>\n    </header>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px\" role=\"tablist\" aria-label=\"Bagian\">\n      <template v-for=\"(t, $index) in tabs\">\n        <button type=\"button\" role=\"tab\" :aria-selected=\"t.on\" @click=\"t.pick\" :style=\"t.style\">{{ t.label }}</button>\n      </template>\n    </div>\n\n    <template v-if=\"isKeg\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n        <section style=\"flex: 1 1 320px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px\">\n          <template v-for=\"(g, $index) in groups\">\n            <button type=\"button\" @click=\"g.pick\" :aria-pressed=\"g.on\" :style=\"g.style\">\n              <span style=\"font-weight: 700; font-size: 15px\">{{ g.label }}</span>\n              <span style=\"font-size: 13px; color: #55605A\">{{ g.cabang }}</span>\n              <span style=\"font-size: 13px\">{{ g.anggota }} anggota</span>\n            </button>\n          </template>\n        </section>\n        <section style=\"flex: 1.3 1 360px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 12px\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px\"><h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">{{ cur.label }} · {{ cur.first }}</h2><span style=\"font-size: 13px; color: #55605A\">Pembimbing: [Nama guru] · Pengurus: Santri Contoh 70</span></div>\n            <button type=\"button\" style=\"height: 40px; border-radius: 10px; border: 1px solid #1F6B4F; background: #FFFFFF; color: #1F6B4F; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap\">Tambah anggota</button>\n          </div>\n          <div style=\"border: 1px solid #E6EBE8; border-radius: 10px; overflow: hidden\">\n            <template v-for=\"(m, $index) in members\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; border-bottom: 1px solid #EEF1EF; font-size: 14px\">\n                <span style=\"font-weight: 600\">{{ m.nama }}</span>\n                <span style=\"font-size: 13px; color: #55605A\">{{ m.kelas }} · hadir {{ m.hadir }}</span>\n              </div>\n            </template>\n          </div>\n          <p style=\"margin: 0; font-size: 13px; color: #55605A; line-height: 1.5\">Keaktifan diambil dari Absensi Kegiatan. Santri yang pindah grup membawa catatannya.</p>\n        </section>\n      </div>\n    </template>\n\n    <template v-if=\"isPres\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n        <section style=\"flex: 1.4 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; overflow-x: auto\">\n          <table style=\"width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px\">\n            <thead><tr style=\"text-align: left; color: #55605A; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em\">\n              <th style=\"padding: 12px 18px; border-bottom: 1px solid #DDE3DF\">Santri</th><th style=\"padding: 12px 18px; border-bottom: 1px solid #DDE3DF\">Lomba</th><th style=\"padding: 12px 18px; border-bottom: 1px solid #DDE3DF\">Tingkat</th><th style=\"padding: 12px 18px; border-bottom: 1px solid #DDE3DF\">Hasil</th>\n            </tr></thead>\n            <tbody>\n              <template v-for=\"(p, $index) in prestasi\">\n                <tr><td style=\"padding: 11px 18px; border-bottom: 1px solid #EEF1EF; font-weight: 600\">{{ p.nama }}</td><td style=\"padding: 11px 18px; border-bottom: 1px solid #EEF1EF\">{{ p.lomba }}</td><td style=\"padding: 11px 18px; border-bottom: 1px solid #EEF1EF\">{{ p.tingkat }}</td><td style=\"padding: 11px 18px; border-bottom: 1px solid #EEF1EF\">{{ p.hasil }}</td></tr>\n              </template>\n            </tbody>\n          </table>\n        </section>\n        <section style=\"flex: 1 1 300px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n          <h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Catat prestasi</h2>\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Santri<input type=\"search\" placeholder=\"Ketik nama atau NIS\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400\"></label>\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Nama lomba<input type=\"text\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400\"></label>\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Tingkat<select style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Pondok</option><option>Kabupaten</option><option>Provinsi</option><option>Nasional</option></select></label>\n          <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Hasil<select style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Juara 1</option><option>Juara 2</option><option>Juara 3</option><option>Harapan 1</option><option>Peserta</option></select></label>\n          <button type=\"button\" style=\"height: 46px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; border: 0; font: inherit; font-weight: 600; cursor: pointer\">Simpan</button>\n        </section>\n      </div>\n    </template>\n  </main>\n</div>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'keg', g: 0 };
  }
  renderVals() {
    const pill = (on) => 'height: 40px; border-radius: 999px; padding: 0 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #1F6B4F; color: #FFFFFF; border: 1px solid #1F6B4F' : 'background: #FFFFFF; color: #2E3833; border: 1px solid #C9D2CC');
    const G = [
      { label: 'Pramuka', cabang: 'DLT 1, DLT 2, …', anggota: 96, first: 'DLT 1' },
      { label: 'Muhadhoroh', cabang: 'Senin malam · Jumat siang', anggota: 120, first: 'Grup 1' },
      { label: "Halaqah Qur'an", cabang: 'per kelompok', anggota: 140, first: 'Kelompok 1' },
      { label: 'Olahraga', cabang: 'Basket, Volley', anggota: 64, first: 'Basket' },
      { label: 'Kesenian', cabang: 'Hadroh, Kaligrafi, Marching Band', anggota: 52, first: 'Hadroh' }
    ];
    const s = this.state.g;
    return {
      tabs: [['keg', 'Kegiatan & Ekstrakurikuler'], ['pres', 'Prestasi Santri']].map(([k, label]) => ({ label, on: this.state.tab === k, style: pill(this.state.tab === k), pick: () => this.setState({ tab: k }) })),
      isKeg: this.state.tab === 'keg', isPres: this.state.tab === 'pres',
      groups: G.map((g, i) => ({
        ...g, anggota: String(g.anggota), on: i === s,
        style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 104px; padding: 14px; border-radius: 12px; font: inherit; color: #18201C; text-align: left; cursor: pointer; ' + (i === s ? 'background: #E3EFE8; border: 1px solid #1F6B4F' : 'background: #FFFFFF; border: 1px solid #DDE3DF'),
        pick: () => this.setState({ g: i })
      })),
      cur: G[s],
      members: [
        { nama: 'Santri Contoh 71', kelas: '2 A MTs', hadir: '92%' },
        { nama: 'Santri Contoh 72', kelas: '2 C SMP', hadir: '88%' },
        { nama: 'Santri Contoh 73', kelas: '3 B MTs', hadir: '100%' },
        { nama: 'Santri Contoh 74', kelas: '4 A', hadir: '75%' },
        { nama: 'Santri Contoh 75', kelas: '4 D', hadir: '96%' }
      ],
      prestasi: [
        { nama: 'Santri Contoh 81', lomba: 'Musabaqah Tilawatil Quran', tingkat: 'Kabupaten', hasil: 'Juara 2' },
        { nama: 'Santri Contoh 82', lomba: 'Pidato Bahasa Arab', tingkat: 'Provinsi', hasil: 'Juara 1' },
        { nama: 'Santri Contoh 83', lomba: 'Panahan', tingkat: 'Pondok', hasil: 'Juara 3' },
        { nama: 'Santri Contoh 84', lomba: 'Kaligrafi', tingkat: 'Nasional', hasil: 'Harapan 1' },
        { nama: 'Santri Contoh 03', lomba: 'Cerdas Cermat', tingkat: 'Kabupaten', hasil: 'Juara 2' }
      ]
    };
  }
}

return Component; })() };
DEFS["Sidebar"] = { props: ["active"], template: "<nav aria-label=\"Menu utama\" style=\"width: 100%; min-height: 900px; background: #FFFFFF; border-right: 1px solid #DDE3DF; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; box-sizing: border-box\">\n  <a href=\"Dashboard.html\" style=\"display: flex; align-items: center; gap: 10px; padding: 4px 8px; text-decoration: none; color: #18201C\">\n    <span style=\"width: 36px; height: 36px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700\">H</span>\n    <span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 700; font-size: 16px\">HISADA</span><span style=\"font-size: 12px; color: #55605A\">{{ lingkungan }} · 2026/2027</span></span>\n  </a>\n  <label style=\"display: flex; flex-direction: column; gap: 6px; padding: 10px; background: #F4F6F4; border: 1px solid #DDE3DF; border-radius: 10px; font-size: 12px; font-weight: 700; color: #3B4540\">Lihat sebagai role (prototipe)\n    <select aria-label=\"Lihat sebagai role\" @change=\"pickPeran\" style=\"height: 38px; border: 1px solid #C9D2CC; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #18201C\">\n      <template v-for=\"(p, $index) in perans\">\n        <option :value=\"p.key\" :selected=\"p.on\">{{ p.label }}</option>\n      </template>\n    </select>\n  </label>\n  <template v-if=\"blocked\">\n    <div role=\"status\" style=\"background: #FBF0DC; color: #5C3B09; border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.5\">Role <strong>{{ peranLabel }}</strong> tidak membuka halaman ini. Isi halaman di samping adalah tampilan Moderator.</div>\n  </template>\n  <template v-for=\"(g, $index) in groups\">\n    <div style=\"display: flex; flex-direction: column; gap: 2px\">\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6A64; padding: 0 10px 6px\">{{ g.label }}</div>\n      <template v-for=\"(it, $index) in g.items\">\n        <a :href=\"it.href\" :style=\"it.style\"><span>{{ it.label }}</span><template v-if=\"it.tag\"><span style=\"font-size: 10px; font-weight: 600; color: #55605A; border: 1px solid #DDE3DF; border-radius: 999px; padding: 1px 6px; white-space: nowrap\">{{ it.tag }}</span></template></a>\n      </template>\n    </div>\n  </template>\n  <div style=\"margin-top: auto; border-top: 1px solid #DDE3DF; padding-top: 14px; display: flex; align-items: center; gap: 10px; padding-left: 8px\">\n    <span style=\"width: 34px; height: 34px; border-radius: 999px; background: #E3EFE8; color: #14533C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px\">{{ inisial }}</span>\n    <span style=\"display: flex; flex-direction: column; font-size: 13px\"><span style=\"font-weight: 600\">{{ pengguna }}</span><a href=\"index.html\" style=\"color: #1F6B4F\">Keluar</a></span>\n  </div>\n</nav>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    let peran = 'moderator';
    try { peran = window.localStorage.getItem('hisada.peran') || 'moderator'; } catch (e) {}
    this.state = { peran };
  }
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-decoration: none; ';
    const on = base + 'background: #E3EFE8; color: #14533C; font-weight: 600';
    const off = base + 'color: #2E3833';
    // Peta akses README: '' = penuh · 'akses' = jika diberi lewat Manajemen Akses · 'lihat' = lihat saja · 'sebagian' = sebagian fitur
    const R = [
      { key: 'moderator', label: 'Moderator', nama: 'Admin pondok (contoh)', inisial: 'MD', ling: 'Semua lingkungan' },
      { key: 'sekretaris', label: 'Sekretaris', nama: 'Santri Contoh 63 · Sekretaris', inisial: 'SK', ling: 'Putra' },
      { key: 'piket', label: 'Piket', nama: 'Santri Contoh 61 · Piket', inisial: 'PK', ling: 'Putra' },
      { key: 'kesehatan', label: 'Kesehatan', nama: 'Santri Contoh 62 · Kesehatan', inisial: 'KS', ling: 'Putra' },
      { key: 'kedisiplinan', label: 'Kedisiplinan', nama: 'Santri Contoh 64 · Kedisiplinan', inisial: 'KD', ling: 'Putra' },
      { key: 'asatidz', label: 'Asatidz (guru)', nama: '[Nama guru] · Asatidz', inisial: 'GR', ling: 'Putra (diatur Moderator)' }
    ];
    const M = {
      dashboard: { moderator: '', sekretaris: '', piket: '', kesehatan: '', kedisiplinan: '', asatidz: '' },
      datamaster: { moderator: '' },
      absensi: { moderator: '', sekretaris: '', piket: '', kesehatan: 'akses', kedisiplinan: 'akses', asatidz: 'lihat' },
      perizinan: { moderator: '', piket: 'akses', asatidz: 'lihat' },
      kesehatan: { moderator: '', kesehatan: 'akses' },
      kedisiplinan: { moderator: '', kedisiplinan: 'akses', asatidz: 'lihat / akses' },
      pd: { moderator: '', sekretaris: '', asatidz: 'lihat' },
      rapor: { moderator: '', sekretaris: '', asatidz: 'lihat' },
      tw: { moderator: '', sekretaris: '', piket: 'lihat', kesehatan: 'lihat', kedisiplinan: 'lihat', asatidz: 'lihat' },
      updatedata: { moderator: '', sekretaris: 'bagian pengurus' },
      akses: { moderator: '' },
      riwayat: { moderator: '', sekretaris: 'masa jabatan' }
    };
    const peran = M.dashboard[this.state.peran] === undefined ? 'moderator' : this.state.peran;
    const role = R.find((r) => r.key === peran);
    const mk = (key, label, href) => {
      const tag = M[key][peran];
      return tag === undefined ? null : { label, href, tag: tag === 'akses' ? 'jika diberi akses' : tag, style: key === active ? on : off };
    };
    const grp = (label, items) => ({ label, items: items.filter(Boolean) });
    return {
      perans: R.map((r) => ({ key: r.key, label: r.label, on: r.key === peran })),
      pickPeran: (e) => {
        const v = e.target.value;
        try { window.localStorage.setItem('hisada.peran', v); } catch (err) {}
        this.setState({ peran: v });
        try { window.location.reload(); } catch (err) {}
      },
      peranLabel: role.label, pengguna: role.nama, inisial: role.inisial, lingkungan: role.ling,
      blocked: M[active] && M[active][peran] === undefined,
      groups: [
        grp('Beranda', [mk('dashboard', 'Dashboard', 'Dashboard.html')]),
        grp('Administrasi', [
          mk('datamaster', 'Data Master', 'DataMaster.html'),
          mk('absensi', 'Absensi', 'Absensi.html'),
          mk('perizinan', 'Perizinan', 'Perizinan.html'),
          mk('kesehatan', 'Kesehatan', 'Kesehatan.html'),
          mk('kedisiplinan', 'Kedisiplinan', 'Kedisiplinan.html'),
          mk('pd', 'Pengembangan Diri', 'PengembanganDiri.html'),
          mk('rapor', 'Rapor Kesantrian', 'Rapor.html'),
          mk('tw', 'Tata Warkat', 'TataWarkat.html')
        ]),
        grp('Fungsi', [
          mk('updatedata', 'Update Data & Import', 'UpdateData.html'),
          mk('akses', 'Manajemen Akses', 'ManajemenAkses.html'),
          mk('riwayat', 'Riwayat Perubahan', 'Riwayat.html')
        ])
      ].filter((g) => g.items.length)
    };
  }
}

return Component; })() };
DCMount("PengembanganDiri", DEFS);
</script>
</body>
</html>
