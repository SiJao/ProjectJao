<!doctype html>

<title>HISADA · Update Data &amp; Import</title>

<style>

*{box-sizing:border-box}
a{color:#1F6B4F}a:hover{color:#14533C}
</style>
</head>
<body>
<div id="app"></div>
<script src="vue.global.prod.js"></script>
<script src="dc-shim.js"></script>
<script>
var DEFS = {};
DEFS["UpdateData"] = { props: [], template: "<div style=\"display: flex; flex-wrap: wrap; min-height: 900px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; background: #F4F6F4\">\n  <div style=\"flex: 1 1 248px; max-width: 100%\">\n    <sidebar-c active=\"updatedata\"></sidebar-c>\n  </div>\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n    <header style=\"display: flex; flex-direction: column; gap: 4px\">\n      <span style=\"font-size: 13px; color: #55605A\">Fungsi › Pengolahan Data</span>\n      <h1 style=\"margin: 0; font-size: 28px; font-weight: 700\">Update Data &amp; Import</h1>\n    </header>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px\" role=\"tablist\" aria-label=\"Jenis update\">\n      <template v-for=\"(t, $index) in tabs\">\n        <button type=\"button\" role=\"tab\" :aria-selected=\"t.on\" @click=\"t.pick\" :style=\"t.style\">{{ t.label }}</button>\n      </template>\n    </div>\n\n    <template v-if=\"isPilih\">\n      <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end\">\n          <div style=\"display: flex; flex-direction: column; gap: 2px\"><h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Pilih banyak → ubah satu kategori</h2><span style=\"font-size: 13px; color: #55605A\">Contoh: pindahkan santri dari kamar berbeda ke satu kamar.</span></div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end\">\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Ubah\n              <select style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Kamar</option><option>Kelas</option><option>Status</option></select>\n            </label>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Menjadi\n              <select style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Ibnu Sina-04</option><option>Ibnu Rusyd-03</option></select>\n            </label>\n          </div>\n        </div>\n        <div style=\"border: 1px solid #E6EBE8; border-radius: 10px; overflow: hidden\">\n          <template v-for=\"(p, $index) in people\">\n            <label style=\"display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; border-bottom: 1px solid #EEF1EF; font-size: 14px; cursor: pointer\">\n              <input type=\"checkbox\" :checked=\"p.on\" @change=\"p.toggle\" style=\"width: 18px; height: 18px\">\n              <span style=\"flex: 1; font-weight: 600\">{{ p.nama }}</span>\n              <span style=\"color: #55605A; font-size: 13px\">{{ p.kamar }}</span>\n            </label>\n          </template>\n        </div>\n        <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px\">\n          <span style=\"font-size: 14px\"><strong>{{ picked }}</strong> santri dipilih → Ibnu Sina-04</span>\n          <button type=\"button\" style=\"height: 46px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; border: 0; padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer\">Pratinjau perubahan</button>\n        </div>\n      </section>\n    </template>\n\n    <template v-if=\"isUpload\">\n      <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n        <ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px\">\n          <template v-for=\"(s, $index) in steps\">\n            <li :style=\"s.style\">{{ s.label }}</li>\n          </template>\n        </ol>\n        <template v-if=\"step1\">\n          <div style=\"border: 2px dashed #B9C4BD; border-radius: 14px; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center\">\n            <strong style=\"font-size: 16px\">Unggah file CSV</strong>\n            <span style=\"font-size: 13px; color: #55605A\">Kolom wajib sesuai jenis update, mis. <code>nis, kamar</code> atau <code>nis, kelas</code></span>\n            <button type=\"button\" @click=\"next\" style=\"height: 44px; border-radius: 10px; border: 1px solid #1F6B4F; background: #FFFFFF; color: #1F6B4F; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer\">Pilih file (contoh)</button>\n          </div>\n        </template>\n        <template v-if=\"step2\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px\">\n              <span style=\"background: #E3F1E9; color: #1E5E3F; border-radius: 999px; padding: 6px 12px; font-weight: 600\">48 baris valid</span>\n              <span style=\"background: #F9E3E1; color: #8E2A22; border-radius: 999px; padding: 6px 12px; font-weight: 600\">2 baris ditolak</span>\n            </div>\n            <div style=\"border: 1px solid #F0C9C4; background: #FDF4F3; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.6\">Baris 12: NIS tidak ditemukan · Baris 31: kamar tidak sesuai jenis kelamin. Perbaiki file lalu unggah ulang.</div>\n            <div style=\"display: flex; gap: 10px\"><button type=\"button\" @click=\"back\" style=\"height: 44px; border-radius: 10px; border: 1px solid #C9D2CC; background: #FFFFFF; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer\">Unggah ulang</button><button type=\"button\" @click=\"next\" style=\"height: 44px; border-radius: 10px; border: 0; background: #1F6B4F; color: #FFFFFF; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer\">Lanjut (contoh)</button></div>\n          </div>\n        </template>\n        <template v-if=\"step3\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 420px\">\n            <div style=\"background: #FBF0DC; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.55; color: #5C3B09\">Peringatan: 50 santri akan dipindahkan. Setiap perubahan tercatat di riwayat dan Riwayat Perubahan.</div>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Password Anda\n              <input type=\"password\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit\">\n            </label>\n            <button type=\"button\" @click=\"reset\" style=\"height: 46px; border-radius: 10px; border: 0; background: #1F6B4F; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer\">Jalankan dalam satu proses</button>\n          </div>\n        </template>\n      </section>\n    </template>\n\n    <template v-if=\"isKelas\">\n      <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"display: flex; flex-direction: column; gap: 2px\"><h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Update Kelas Tahunan · 2026/2027 → 2027/2028</h2><span style=\"font-size: 13px; color: #55605A\">Hanya Moderator · satu kali per tahun ajaran · file <code>nis, kelas</code></span></div>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px\">\n          <template v-for=\"(k, $index) in kelasSum\">\n            <div style=\"border: 1px solid #E6EBE8; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 13px; color: #55605A\">{{ k.label }}</span><span style=\"font-size: 26px; font-weight: 700\">{{ k.n }}</span></div>\n          </template>\n        </div>\n        <p style=\"margin: 0; font-size: 13px; color: #55605A; line-height: 1.55\">Kelas 6 menjadi Alumni (akun nonaktif). Centang Kelas 6 yang tidak lulus. Santri yang tidak tercantum di file ditahan (menunggu penempatan).</p>\n      </section>\n    </template>\n\n    <template v-if=\"isST\">\n      <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n        <h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Jabatan pengurus</h2>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n          <div style=\"flex: 1 1 280px; border: 1px solid #E6EBE8; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px\">\n            <strong>Serah Terima Jabatan (semua)</strong>\n            <span style=\"font-size: 13px; color: #55605A; line-height: 1.55\">Moderator menunjuk 1–2 Sekretaris baru → arsip masa khidmat lama → Sekretaris mengisi bagian (file NIS + jabatan) → Moderator menetapkan role.</span>\n            <span style=\"font-size: 13px\">Serah terima terakhir: 8 bulan lalu</span>\n          </div>\n          <div style=\"flex: 1 1 280px; border: 1px solid #E6EBE8; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px\">\n            <strong>PAW (satu orang)</strong>\n            <span style=\"font-size: 13px; color: #55605A; line-height: 1.55\">Nonaktifkan jabatan satu pengurus (alasan wajib) → angkat santri aktif kelas 5/6 → tetapkan role → peringatan + password.</span>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Alasan\n              <select style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Mundur</option><option>Skorsing</option><option>Sakit lama</option><option>Dikeluarkan</option></select>\n            </label>\n          </div>\n        </div>\n      </section>\n    </template>\n  </main>\n</div>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'pilih', step: 1, sel: { 0: true, 2: true, 3: true } };
  }
  renderVals() {
    const pill = (on) => 'height: 40px; border-radius: 999px; padding: 0 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #1F6B4F; color: #FFFFFF; border: 1px solid #1F6B4F' : 'background: #FFFFFF; color: #2E3833; border: 1px solid #C9D2CC');
    const P = [['Santri Contoh 51', 'Ibnu Rusyd-01'], ['Santri Contoh 52', 'Ibnu Rusyd-02'], ['Santri Contoh 53', 'Ibnu Sina-01'], ['Santri Contoh 54', 'Kholid Bin Walid-03'], ['Santri Contoh 55', 'Ibnu Sina-02'], ['Santri Contoh 56', 'Bilal bin Rabah-01']];
    const sel = this.state.sel;
    const st = this.state.step;
    const stepStyle = (n) => 'border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; ' + (st === n ? 'background: #1F6B4F; color: #FFFFFF' : (st > n ? 'background: #E3EFE8; color: #14533C' : 'background: #EEF1EF; color: #55605A'));
    return {
      tabs: [['pilih', 'Pilih banyak'], ['upload', 'Upload file'], ['kelas', 'Update Kelas Tahunan'], ['st', 'Serah Terima & PAW']].map(([k, label]) => ({ label, on: this.state.tab === k, style: pill(this.state.tab === k), pick: () => this.setState({ tab: k }) })),
      isPilih: this.state.tab === 'pilih', isUpload: this.state.tab === 'upload', isKelas: this.state.tab === 'kelas', isST: this.state.tab === 'st',
      people: P.map(([nama, kamar], i) => ({ nama, kamar, on: !!sel[i], toggle: () => this.setState({ sel: { ...sel, [i]: !sel[i] } }) })),
      picked: String(Object.values(sel).filter(Boolean).length),
      steps: [[1, '1 · Unggah'], [2, '2 · Pratinjau'], [3, '3 · Konfirmasi']].map(([n, label]) => ({ label, style: stepStyle(n) })),
      step1: st === 1, step2: st === 2, step3: st === 3,
      next: () => this.setState({ step: Math.min(3, st + 1) }), back: () => this.setState({ step: 1 }), reset: () => this.setState({ step: 1 }),
      kelasSum: [{ label: 'Naik / tinggal kelas', n: '812' }, { label: 'Menjadi Alumni', n: '168' }, { label: 'Ditahan', n: '5' }, { label: 'Ditolak', n: '0' }]
    };
  }
}

return Component; })() };
DEFS["Sidebar"] = { props: ["active"], template: "<nav aria-label=\"Menu utama\" style=\"width: 100%; min-height: 900px; background: #FFFFFF; border-right: 1px solid #DDE3DF; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; box-sizing: border-box\">\n  <a href=\"Dashboard.html\" style=\"display: flex; align-items: center; gap: 10px; padding: 4px 8px; text-decoration: none; color: #18201C\">\n    <span style=\"width: 36px; height: 36px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700\">H</span>\n    <span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 700; font-size: 16px\">HISADA</span><span style=\"font-size: 12px; color: #55605A\">Putra · 2026/2027</span></span>\n  </a>\n  <template v-for=\"(g, $index) in groups\">\n    <div style=\"display: flex; flex-direction: column; gap: 2px\">\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6A64; padding: 0 10px 6px\">{{ g.label }}</div>\n      <template v-for=\"(it, $index) in g.items\">\n        <template v-if=\"it.live\">\n          <a :href=\"it.href\" :style=\"it.style\">{{ it.label }}</a>\n        </template>\n        <template v-if=\"it.soon\">\n          <span style=\"display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-radius: 8px; font-size: 14px; color: #6B756F\">{{ it.label }}<span style=\"font-size: 11px; border: 1px solid #DDE3DF; border-radius: 999px; padding: 1px 7px\">nanti</span></span>\n        </template>\n      </template>\n    </div>\n  </template>\n  <div style=\"margin-top: auto; border-top: 1px solid #DDE3DF; padding-top: 14px; display: flex; align-items: center; gap: 10px; padding-left: 8px\">\n    <span style=\"width: 34px; height: 34px; border-radius: 999px; background: #E3EFE8; color: #14533C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px\">SK</span>\n    <span style=\"display: flex; flex-direction: column; font-size: 13px\"><span style=\"font-weight: 600\">Sekretaris (contoh)</span><a href=\"index.html\" style=\"color: #1F6B4F\">Keluar</a></span>\n  </div>\n</nav>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: block; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-decoration: none; ';
    const on = base + 'background: #E3EFE8; color: #14533C; font-weight: 600';
    const off = base + 'color: #2E3833';
    const mk = (key, label, href) => ({ label, href, live: !!href, soon: !href, style: key === active ? on : off });
    return {
      groups: [
        { label: 'Beranda', items: [mk('dashboard', 'Dashboard', 'Dashboard.html')] },
        { label: 'Administrasi', items: [
          mk('datamaster', 'Data Master', 'DataMaster.html'),
          mk('absensi', 'Absensi', 'Absensi.html'),
          mk('perizinan', 'Perizinan', 'Perizinan.html'),
          mk('kesehatan', 'Kesehatan', 'Kesehatan.html'),
          mk('kedisiplinan', 'Kedisiplinan', 'Kedisiplinan.html'),
          mk('pd', 'Pengembangan Diri', 'PengembanganDiri.html'),
          mk('rapor', 'Rapor Kesantrian', 'Rapor.html'),
          mk('tw', 'Tata Warkat', 'TataWarkat.html')
        ] },
        { label: 'Fungsi', items: [
          mk('updatedata', 'Update Data & Import', 'UpdateData.html'),
          mk('akses', 'Manajemen Akses', 'ManajemenAkses.html'),
          mk('riwayat', 'Riwayat Perubahan', 'Riwayat.html')
        ] }
      ]
    };
  }
}

return Component; })() };
DCMount("UpdateData", DEFS);
</script>
