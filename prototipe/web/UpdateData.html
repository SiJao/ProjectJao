<script>
var DEFS = {};
DEFS["UpdateData"] = { props: [], template: "<div style=\"display: flex; flex-wrap: wrap; min-height: 900px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; background: #F4F6F4\">\n  <div style=\"flex: 1 1 248px; max-width: 100%\">\n    <sidebar-c active=\"updatedata\"></sidebar-c>\n  </div>\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n    <header style=\"display: flex; flex-direction: column; gap: 4px\">\n      <span style=\"font-size: 13px; color: #55605A\">Fungsi › Pengolahan Data</span>\n      <h1 style=\"margin: 0; font-size: 28px; font-weight: 700\">Update Data &amp; Import</h1>\n    </header>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px\" role=\"tablist\" aria-label=\"Jenis update\">\n      <template v-for=\"(t, $index) in tabs\">\n        <button type=\"button\" role=\"tab\" :aria-selected=\"t.on\" @click=\"t.pick\" :style=\"t.style\">{{ t.label }}</button>\n      </template>\n    </div>\n\n    <template v-if=\"isPilih\">\n      <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end\">\n          <div style=\"display: flex; flex-direction: column; gap: 2px\"><h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Update Kamar · pilih banyak → satu kamar</h2><span style=\"font-size: 13px; color: #55605A\">Rotasi 1–2× setahun. Bisa juga lewat tab Upload file (kolom <code>nis, kamar</code>). Setiap perpindahan tercatat di riwayat kamar.</span></div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end\">\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Pindahkan ke kamar\n              <select aria-label=\"Kamar tujuan\" @change=\"pickKamar\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\">\n                <template v-for=\"(k, $index) in kamarOpts\">\n                  <option :value=\"k.v\" :selected=\"k.on\">{{ k.v }}</option>\n                </template>\n              </select>\n              <span style=\"font-weight: 400; color: #55605A\">Hanya kamar putra (sesuai jenis kelamin santri terpilih)</span>\n            </label>\n          </div>\n        </div>\n        <div style=\"border: 1px solid #E6EBE8; border-radius: 10px; overflow: hidden\">\n          <template v-for=\"(p, $index) in people\">\n            <label style=\"display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; border-bottom: 1px solid #EEF1EF; font-size: 14px; cursor: pointer\">\n              <input type=\"checkbox\" :checked=\"p.on\" @change=\"p.toggle\" style=\"width: 18px; height: 18px\">\n              <span style=\"flex: 1; font-weight: 600\">{{ p.nama }}</span>\n              <span style=\"color: #55605A; font-size: 13px\">{{ p.kamar }}</span>\n            </label>\n          </template>\n        </div>\n        <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px\">\n          <span style=\"font-size: 14px\"><strong>{{ picked }}</strong> santri dipilih → {{ kamarTujuan }}</span>\n          <button type=\"button\" style=\"height: 46px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; border: 0; padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer\">Pratinjau → peringatan + password</button>\n        </div>\n      </section>\n    </template>\n\n    <template v-if=\"isUpload\">\n      <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n        <ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px\">\n          <template v-for=\"(s, $index) in steps\">\n            <li :style=\"s.style\">{{ s.label }}</li>\n          </template>\n        </ol>\n        <template v-if=\"step1\">\n          <div style=\"border: 2px dashed #B9C4BD; border-radius: 14px; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center\">\n            <strong style=\"font-size: 16px\">Unggah file CSV</strong>\n            <span style=\"font-size: 13px; color: #55605A\">Kolom wajib sesuai jenis update, mis. <code>nis, kamar</code> atau <code>nis, kelas</code></span>\n            <button type=\"button\" @click=\"next\" style=\"height: 44px; border-radius: 10px; border: 1px solid #1F6B4F; background: #FFFFFF; color: #1F6B4F; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer\">Pilih file (contoh)</button>\n          </div>\n        </template>\n        <template v-if=\"step2\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <template v-if=\"adaTolak\">\n              <div style=\"display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px\">\n                <span style=\"background: #E3F1E9; color: #1E5E3F; border-radius: 999px; padding: 6px 12px; font-weight: 600\">48 baris valid</span>\n                <span style=\"background: #F9E3E1; color: #8E2A22; border-radius: 999px; padding: 6px 12px; font-weight: 600\">2 baris ditolak</span>\n              </div>\n              <div style=\"border: 1px solid #F0C9C4; background: #FDF4F3; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.6\">Baris 12: NIS tidak ditemukan · Baris 31: kamar tidak sesuai jenis kelamin. Proses tidak bisa dilanjutkan selama ada baris ditolak — perbaiki file lalu unggah ulang.</div>\n              <div style=\"display: flex; gap: 10px\"><button type=\"button\" @click=\"perbaiki\" style=\"height: 44px; border-radius: 10px; border: 0; background: #1F6B4F; color: #FFFFFF; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer\">Unggah ulang file yang sudah diperbaiki (contoh)</button></div>\n            </template>\n            <template v-if=\"bersih\">\n              <div style=\"display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px\">\n                <span style=\"background: #E3F1E9; color: #1E5E3F; border-radius: 999px; padding: 6px 12px; font-weight: 600\">50 baris valid</span>\n                <span style=\"background: #EEF1EF; color: #3B4540; border-radius: 999px; padding: 6px 12px; font-weight: 600\">0 baris ditolak</span>\n              </div>\n              <div style=\"display: flex; gap: 10px\"><button type=\"button\" @click=\"back\" style=\"height: 44px; border-radius: 10px; border: 1px solid #C9D2CC; background: #FFFFFF; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer\">Batal</button><button type=\"button\" @click=\"next\" style=\"height: 44px; border-radius: 10px; border: 0; background: #1F6B4F; color: #FFFFFF; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer\">Lanjut</button></div>\n            </template>\n          </div>\n        </template>\n        <template v-if=\"step3\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px; max-width: 420px\">\n            <div style=\"background: #FBF0DC; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.55; color: #5C3B09\">Peringatan: 50 santri akan dipindahkan. Setiap perpindahan tercatat di riwayat kamar dan Riwayat Perubahan.</div>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Password Anda\n              <input type=\"password\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit\">\n            </label>\n            <button type=\"button\" @click=\"reset\" style=\"height: 46px; border-radius: 10px; border: 0; background: #1F6B4F; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer\">Jalankan dalam satu proses</button>\n          </div>\n        </template>\n      </section>\n    </template>\n\n    <template v-if=\"isKelas\">\n      <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"display: flex; flex-direction: column; gap: 2px\"><h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Update Kelas Tahunan · 2026/2027 → 2027/2028</h2><span style=\"font-size: 13px; color: #55605A\">Hanya Moderator · satu kali per tahun ajaran · tahun ajaran 2027/2028 berstatus persiapan · file <code>nis, kelas</code> (Kelas 1–5 saja)</span></div>\n        <ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; font-weight: 600\">\n          <li style=\"border-radius: 999px; padding: 6px 14px; background: #E3EFE8; color: #14533C\">1 · Unggah file</li>\n          <li style=\"border-radius: 999px; padding: 6px 14px; background: #1F6B4F; color: #FFFFFF\">2 · Pratinjau</li>\n          <li style=\"border-radius: 999px; padding: 6px 14px; background: #EEF1EF; color: #55605A\">3 · Peringatan + password</li>\n        </ol>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px\">\n          <template v-for=\"(k, $index) in kelasSum\">\n            <div style=\"border: 1px solid #E6EBE8; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 13px; color: #55605A\">{{ k.label }}</span><span style=\"font-size: 26px; font-weight: 700\">{{ k.n }}</span><span style=\"font-size: 12px; color: #55605A\">{{ k.note }}</span></div>\n          </template>\n        </div>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <span style=\"font-size: 13px; font-weight: 600\">Kelas 6 → Alumni · centang yang TIDAK lulus (tetap Kelas 6 aktif)</span>\n          <div style=\"border: 1px solid #E6EBE8; border-radius: 10px; overflow: hidden\">\n            <template v-for=\"(k, $index) in kelas6\">\n              <label style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 14px; border-bottom: 1px solid #EEF1EF; font-size: 14px; cursor: pointer\">\n                <input type=\"checkbox\" :checked=\"k.on\" @change=\"k.toggle\" style=\"width: 18px; height: 18px\">\n                <span style=\"flex: 1; font-weight: 600\">{{ k.nama }}</span><span style=\"color: #55605A; font-size: 13px\">{{ k.kelas }}</span>\n              </label>\n            </template>\n          </div>\n        </div>\n        <div style=\"background: #FBF0DC; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.55; color: #5C3B09\">Peringatan: {{ alumniN }} santri Kelas 6 menjadi Alumni (akun login nonaktif). Santri atas nama Santri Contoh 71, 72, 73, 74, dan 75 tidak dinyatakan naik kelas. 5 santri yang tidak tercantum di file ditahan (menunggu penempatan).</div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end\">\n          <label style=\"flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Password Moderator yang sedang login\n            <input type=\"password\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit\">\n          </label>\n          <button type=\"button\" style=\"height: 46px; border-radius: 10px; border: 0; background: #1F6B4F; color: #FFFFFF; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer\">Jalankan Update Kelas Tahunan</button>\n        </div>\n      </section>\n    </template>\n\n    <template v-if=\"isST\">\n      <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n        <h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Jabatan pengurus</h2>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n          <div style=\"flex: 1 1 300px; border: 1px solid #E6EBE8; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n            <strong>Serah Terima Jabatan (semua, putra &amp; putri bersamaan)</strong>\n            <ol style=\"margin: 0; padding-left: 18px; font-size: 13px; color: #3B4540; line-height: 1.6\">\n              <li><strong>Moderator</strong>: tunjuk 1–2 Sekretaris baru → peringatan → password → jalankan.</li>\n              <li><strong>Sekretaris baru</strong>: isi bagian pengurus lain (file NIS + jabatan atau pilih banyak; hanya santri aktif Kelas 5).</li>\n              <li><strong>Moderator</strong>: tetapkan role &amp; akses di Manajemen Akses.</li>\n            </ol>\n            <fieldset style=\"margin: 0; border: 0; padding: 0; display: flex; flex-direction: column; gap: 6px\">\n              <legend style=\"padding: 0 0 6px; font-size: 13px; font-weight: 600\">Sekretaris baru (santri aktif Kelas 5) · pilih 1–2</legend>\n              <div style=\"border: 1px solid #E6EBE8; border-radius: 10px; overflow: hidden\">\n                <template v-for=\"(o, $index) in sekOpts\">\n                  <label :style=\"o.style\">\n                    <input type=\"checkbox\" :checked=\"o.on\" :disabled=\"o.off\" @change=\"o.toggle\" style=\"width: 18px; height: 18px\">\n                    <span style=\"flex: 1; font-weight: 600\">{{ o.nama }}</span><span style=\"color: #55605A; font-size: 13px\">{{ o.kelas }}</span>\n                  </label>\n                </template>\n              </div>\n              <span style=\"font-size: 12px; color: #55605A\">{{ sekNote }}</span>\n            </fieldset>\n            <div style=\"background: #FBF0DC; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.55; color: #5C3B09\">Peringatan: semua akun pengurus lama (42) dinonaktifkan; santrinya tetap aktif. Masa khidmat lama diarsipkan. Serah terima terakhir: 8 bulan lalu.</div>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Password Moderator yang sedang login\n              <input type=\"password\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit\">\n            </label>\n            <button type=\"button\" style=\"height: 46px; border-radius: 10px; border: 0; background: #1F6B4F; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer\">Jalankan Serah Terima</button>\n          </div>\n          <div style=\"flex: 1 1 280px; border: 1px solid #E6EBE8; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n            <strong>PAW (satu orang)</strong>\n            <span style=\"font-size: 13px; color: #55605A; line-height: 1.55\">Nonaktifkan jabatan satu pengurus (alasan wajib) → angkat santri aktif kelas 5/6 → tetapkan role → peringatan + password.</span>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Pengurus yang diganti\n              <select style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Santri Contoh 61 · Piket</option><option>Santri Contoh 62 · Kesehatan</option><option>Santri Contoh 63 · Sekretaris</option><option>Santri Contoh 64 · Kedisiplinan</option></select>\n            </label>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Alasan\n              <select style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Mundur</option><option>Skorsing</option><option>Sakit lama</option><option>Dikeluarkan</option></select>\n            </label>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Santri pengganti (aktif Kelas 5/6)\n              <input type=\"search\" placeholder=\"Cari nama atau NIS santri Kelas 5/6\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400\">\n            </label>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Role\n              <select style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Sama dengan pengurus yang diganti</option><option>Sekretaris</option><option>Piket</option><option>Kesehatan</option><option>Kedisiplinan</option></select>\n            </label>\n            <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Password Moderator yang sedang login\n              <input type=\"password\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit\">\n            </label>\n            <button type=\"button\" style=\"height: 46px; border-radius: 10px; border: 1px solid #1F6B4F; background: #FFFFFF; color: #1F6B4F; font: inherit; font-weight: 600; cursor: pointer\">Jalankan PAW</button>\n          </div>\n        </div>\n      </section>\n    </template>\n  </main>\n</div>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'pilih', step: 1, fixed: false, sel: { 0: true, 2: true, 3: true }, tdkLulus: { 1: true }, kamar: 'Ibnu Sina-04', sek: { 0: true } };
  }
  renderVals() {
    const pill = (on) => 'height: 40px; border-radius: 999px; padding: 0 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #1F6B4F; color: #FFFFFF; border: 1px solid #1F6B4F' : 'background: #FFFFFF; color: #2E3833; border: 1px solid #C9D2CC');
    const P = [['Santri Contoh 51', 'Ibnu Rusyd-01'], ['Santri Contoh 52', 'Ibnu Rusyd-02'], ['Santri Contoh 53', 'Ibnu Sina-01'], ['Santri Contoh 54', 'Kholid Bin Walid-03'], ['Santri Contoh 55', 'Ibnu Sina-02'], ['Santri Contoh 56', 'Bilal bin Rabah-01']];
    const sel = this.state.sel;
    const st = this.state.step;
    const tlm = this.state.tdkLulus;
    const tl = Object.values(tlm).filter(Boolean).length;
    const KAMAR = ['Ibnu Sina-04', 'Ibnu Rusyd-03'];
    const SEK = [['Santri Contoh 91', '5 A'], ['Santri Contoh 92', '5 C'], ['Santri Contoh 93', '5 B']];
    const sek = this.state.sek;
    const sekN = Object.values(sek).filter(Boolean).length;
    const stepStyle = (n) => 'border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; ' + (st === n ? 'background: #1F6B4F; color: #FFFFFF' : (st > n ? 'background: #E3EFE8; color: #14533C' : 'background: #EEF1EF; color: #55605A'));
    return {
      tabs: [['pilih', 'Update Kamar'], ['upload', 'Upload file'], ['kelas', 'Update Kelas Tahunan'], ['st', 'Serah Terima & PAW']].map(([k, label]) => ({ label, on: this.state.tab === k, style: pill(this.state.tab === k), pick: () => this.setState({ tab: k }) })),
      isPilih: this.state.tab === 'pilih', isUpload: this.state.tab === 'upload', isKelas: this.state.tab === 'kelas', isST: this.state.tab === 'st',
      people: P.map(([nama, kamar], i) => ({ nama, kamar, on: !!sel[i], toggle: () => this.setState({ sel: { ...sel, [i]: !sel[i] } }) })),
      picked: String(Object.values(sel).filter(Boolean).length),
      kamarOpts: KAMAR.map((v) => ({ v, on: v === this.state.kamar })),
      kamarTujuan: this.state.kamar,
      pickKamar: (e) => { const v = e && e.target ? e.target.value : ''; if (KAMAR.includes(v)) this.setState({ kamar: v }); },
      sekOpts: SEK.map(([nama, kelas], i) => {
        const on = !!sek[i];
        const off = !on && sekN >= 2;
        return {
          nama, kelas, on, off,
          style: 'display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 14px; border-bottom: 1px solid #EEF1EF; font-size: 14px; ' + (off ? 'color: #6B756F; cursor: not-allowed' : 'cursor: pointer'),
          toggle: () => { if (on || sekN < 2) this.setState({ sek: { ...sek, [i]: !on } }); }
        };
      }),
      sekNote: sekN === 0 ? 'Pilih minimal 1 Sekretaris baru.' : (sekN === 1 ? '1 dipilih · Sekretaris kedua opsional.' : '2 dipilih · batas maksimal tercapai.'),
      steps: [[1, '1 · Unggah'], [2, '2 · Pratinjau'], [3, '3 · Konfirmasi']].map(([n, label]) => ({ label, style: stepStyle(n) })),
      step1: st === 1, step2: st === 2, step3: st === 3,
      adaTolak: !this.state.fixed, bersih: !!this.state.fixed,
      perbaiki: () => this.setState({ fixed: true }),
      next: () => this.setState({ step: Math.min(3, st + 1) }), back: () => this.setState({ step: 1, fixed: false }), reset: () => this.setState({ step: 1, fixed: false }),
      // 1.072 santri aktif = Kelas 1–5: 902 (892 naik + 5 tetap + 5 ditahan) + Kelas 6: 170 (alumni + tidak lulus)
      kelasSum: [
        { label: 'Naik kelas', n: '892', note: 'tingkat +1' },
        { label: 'Tetap di tingkat', n: '5', note: 'boleh, nama disebut di peringatan' },
        { label: 'Menjadi Alumni', n: String(170 - tl), note: tl + ' Kelas 6 dikecualikan' },
        { label: 'Ditahan', n: '5', note: 'tidak tercantum di file' },
        { label: 'Ditolak', n: '0', note: 'lompat / turun tingkat, NIS salah — harus 0' }
      ],
      alumniN: String(170 - tl),
      kelas6: [['Santri Contoh 95', '6 A MIA'], ['Santri Contoh 96', '6 F IIS'], ['Santri Contoh 97', '6 B MIA']].map(([nama, kelas], i) => ({ nama, kelas, on: !!tlm[i], toggle: () => this.setState({ tdkLulus: { ...tlm, [i]: !tlm[i] } }) }))
    };
  }
