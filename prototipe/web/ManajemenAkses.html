<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HISADA · Manajemen Akses</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#18201C}
*{box-sizing:border-box}
a{color:#1F6B4F}a:hover{color:#14533C}
</style>
</head>
<body>
<div id="app"></div>
<script src="vue.global.prod.js"></script>
<script src="dc-shim.js"></script>
<script>
var DEFS = {};
DEFS["ManajemenAkses"] = { props: [], template: "<div style=\"display: flex; flex-wrap: wrap; min-height: 900px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; background: #F4F6F4\">\n  <div style=\"flex: 1 1 248px; max-width: 100%\">\n    <sidebar-c active=\"akses\"></sidebar-c>\n  </div>\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n    <header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-size: 13px; color: #55605A\">Fungsi › Akses</span>\n        <h1 style=\"margin: 0; font-size: 28px; font-weight: 700\">Manajemen Akses</h1>\n      </div>\n      <span style=\"font-size: 12px; color: #14533C; background: #E3EFE8; border-radius: 999px; padding: 5px 12px; font-weight: 600\">Hanya Moderator</span>\n    </header>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n      <section style=\"flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 8px 0\">\n        <div style=\"padding: 12px 20px; display: flex; flex-direction: column; gap: 10px\">\n          <h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Pengguna</h2>\n          <input type=\"search\" aria-label=\"Cari pengguna\" placeholder=\"Cari nama, NIS, atau NIP\" style=\"height: 42px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit\">\n        </div>\n        <template v-for=\"(u, $index) in users\">\n          <button type=\"button\" @click=\"u.pick\" :style=\"u.style\">\n            <span style=\"display: flex; flex-direction: column; gap: 2px; text-align: left\"><span style=\"font-weight: 600\">{{ u.nama }}</span><span style=\"font-size: 13px; color: #55605A\">{{ u.id }}</span></span>\n            <span style=\"font-size: 12px; font-weight: 700; color: #3B4540; background: #EEF1EF; border-radius: 999px; padding: 3px 10px; white-space: nowrap\">{{ u.role }}</span>\n          </button>\n        </template>\n      </section>\n\n      <section style=\"flex: 1.4 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"display: flex; flex-direction: column; gap: 2px\"><h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">{{ cur.nama }}</h2><span style=\"font-size: 13px; color: #55605A\">{{ cur.id }}</span></div>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Role (satu per pengguna)\n          <select @change=\"pickRole\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\">\n            <template v-for=\"(r, $index) in roles\">\n              <option :value=\"r.label\" :selected=\"r.on\" :disabled=\"r.off\">{{ r.text }}</option>\n            </template>\n          </select>\n          <span style=\"font-weight: 400; color: #55605A\">{{ roleNote }}</span>\n        </label>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Cakupan data\n          <template v-if=\"cakupanPilih\">\n            <select style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Putra</option><option>Putri</option><option>Semua</option></select>\n          </template>\n          <template v-if=\"cakupanTetap\">\n            <span style=\"font-weight: 400; min-height: 44px; display: flex; align-items: center; padding: 0 12px; border: 1px dashed #C9D2CC; border-radius: 10px; color: #3B4540\">{{ cakupanText }}</span>\n          </template>\n        </label>\n        <div style=\"display: flex; flex-direction: column; gap: 8px\">\n          <span style=\"font-size: 13px; font-weight: 600\">Akses di luar role</span>\n          <template v-for=\"(p, $index) in perms\">\n            <label :style=\"p.rowStyle\">\n              <input type=\"checkbox\" :checked=\"p.on\" :disabled=\"p.locked\" @change=\"p.toggle\" style=\"width: 18px; height: 18px\">\n              <span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 600\">{{ p.label }}</span><span style=\"font-size: 12px; color: #55605A\">{{ p.desc }}</span></span>\n            </label>\n          </template>\n        </div>\n        <p style=\"margin: 0; font-size: 13px; color: #55605A; line-height: 1.5\">Setiap pemberian atau pencabutan akses tercatat di Riwayat Perubahan dan diberitahukan ke pemilik akun lewat email.</p>\n        <button type=\"button\" style=\"height: 46px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; border: 0; font: inherit; font-weight: 600; cursor: pointer\">Simpan akses</button>\n      </section>\n    </div>\n  </main>\n</div>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, roleOf: {}, perms: { 0: { putusan: true }, 1: { perizinan: true }, 2: { kesehatan: true, absensi: true, profil_kesehatan: true, 'pilihan.obat': true }, 3: {}, 4: { input_pelanggaran: true, putusan: true }, 5: {} } };
  }
  renderVals() {
    // santri: akun pengurus (NIS) · guru: akun non-santri (NIP)
    const U = [
      { nama: '[Nama guru] · guru (hakim)', id: 'NIP 9902', role: 'Asatidz', jenis: 'guru' },
      { nama: 'Santri Contoh 61 · pengurus', id: 'NIS 990661', role: 'Piket', jenis: 'santri' },
      { nama: 'Santri Contoh 62 · pengurus', id: 'NIS 990662', role: 'Kesehatan', jenis: 'santri' },
      { nama: 'Santri Contoh 63 · pengurus', id: 'NIS 990663', role: 'Sekretaris', jenis: 'santri' },
      { nama: 'Santri Contoh 64 · pengurus', id: 'NIS 990664', role: 'Kedisiplinan', jenis: 'santri' },
      { nama: 'Admin pondok · tim IT', id: 'NIP 9900', role: 'Moderator', jenis: 'guru' }
    ];
    const ROLES = [['Piket', 'santri'], ['Kesehatan', 'santri'], ['Kedisiplinan', 'santri'], ['Sekretaris', 'santri'], ['Asatidz', 'guru'], ['Moderator', 'guru']];
    // [kode, label, keterangan, otomatis untuk role, hanya untuk role]
    const PL = [
      ['absensi', 'Absensi', 'Mengisi absensi harian / kegiatan', ['Piket', 'Sekretaris'], null],
      ['perizinan', 'Perizinan', 'Menerbitkan izin, Gate Pass, Libur Pondok', [], ['Piket']],
      ['kesehatan', 'Kesehatan', 'Membuka data kunjungan dan pemeriksaan', [], ['Kesehatan']],
      ['profil_kesehatan', 'Profil kesehatan', 'Mengedit alergi dan penyakit kronis', [], null],
      ['input_pelanggaran', 'Input pelanggaran', 'Mencatat pelanggaran santri (penginput)', [], null],
      ['putusan', 'Putusan kedisiplinan', 'Memvonis dan memutihkan (bukan kasus yang ia catat)', [], null],
      ['input_pelanggaran_pengurus', 'Input pelanggaran pengurus', 'Untuk guru pengasuhan', [], ['Asatidz']],
      ['penilaian', 'Penilaian kegiatan', 'Tahsin, muhadhoroh, ekstrakurikuler', [], null],
      ['pilihan.obat', 'Daftar pilihan · Obat', 'Mengedit daftar obat di Data Master', [], null],
      ['pilihan.diagnosa', 'Daftar pilihan · Diagnosa', 'Mengedit daftar diagnosa di Data Master', [], null]
    ];
    const s = this.state.sel;
    const u = U[s];
    const role = this.state.roleOf[s] || u.role;
    const mod = role === 'Moderator';
    const mine = this.state.perms[s] || {};
    const row = (dim) => 'display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 8px 12px; border: 1px solid #E6EBE8; border-radius: 10px; font-size: 14px; ' + (dim ? 'background: #F4F6F4; color: #6B756F; cursor: not-allowed' : 'cursor: pointer');
    return {
      users: U.map((x, i) => ({
        ...x, role: this.state.roleOf[i] || x.role,
        style: 'display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 20px; border: 0; border-top: 1px solid #EEF1EF; font: inherit; color: #18201C; cursor: pointer; ' + (i === s ? 'background: #EEF5F1' : 'background: #FFFFFF'),
        pick: () => this.setState({ sel: i })
      })),
      cur: u,
      roles: ROLES.map(([r, j]) => ({ label: r, on: r === role, off: j !== u.jenis, text: r + (j !== u.jenis ? (j === 'guru' ? ' — hanya akun non-santri' : ' — hanya akun santri') : '') })),
      pickRole: (e) => this.setState({ roleOf: { ...this.state.roleOf, [s]: e.target.value } }),
      roleNote: u.jenis === 'santri' ? 'Akun santri: Moderator dan Asatidz tidak tersedia.' : 'Akun non-santri (guru / pihak pondok).',
      cakupanPilih: role === 'Asatidz', cakupanTetap: role !== 'Asatidz',
      cakupanText: mod ? 'Semua lingkungan (Moderator)' : 'Putra — otomatis dari jenis kelamin santri',
      perms: PL.map(([k, label, desc, auto, only]) => {
        const otomatis = mod || auto.indexOf(role) >= 0;
        const terlarang = !otomatis && only && only.indexOf(role) < 0;
        const ket = otomatis ? (mod ? 'Moderator memegang semua akses' : 'otomatis dari role ' + role) : (terlarang ? 'hanya untuk role ' + only.join(' / ') : desc);
        return {
          label, desc: ket, on: otomatis || (!terlarang && !!mine[k]), locked: otomatis || terlarang, rowStyle: row(otomatis || terlarang),
          toggle: () => { if (!otomatis && !terlarang) this.setState({ perms: { ...this.state.perms, [s]: { ...mine, [k]: !mine[k] } } }); }
        };
      })
    };
  }
}

return Component; })() };
DEFS["Sidebar"] = { props: ["active"], template: "<nav aria-label=\"Menu utama\" style=\"width: 100%; min-height: 900px; background: #FFFFFF; border-right: 1px solid #DDE3DF; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; box-sizing: border-box\">\n  <a href=\"Dashboard.html\" style=\"display: flex; align-items: center; gap: 10px; padding: 4px 8px; text-decoration: none; color: #18201C\">\n    <span style=\"width: 36px; height: 36px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700\">H</span>\n    <span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 700; font-size: 16px\">HISADA</span><span style=\"font-size: 12px; color: #55605A\">{{ lingkungan }} · 2026/2027</span></span>\n  </a>\n  <label style=\"display: flex; flex-direction: column; gap: 6px; padding: 10px; background: #F4F6F4; border: 1px solid #DDE3DF; border-radius: 10px; font-size: 12px; font-weight: 700; color: #3B4540\">Lihat sebagai role (prototipe)\n    <select aria-label=\"Lihat sebagai role\" @change=\"pickPeran\" style=\"height: 38px; border: 1px solid #C9D2CC; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #18201C\">\n      <template v-for=\"(p, $index) in perans\">\n        <option :value=\"p.key\" :selected=\"p.on\">{{ p.label }}</option>\n      </template>\n    </select>\n  </label>\n  <template v-if=\"blocked\">\n    <div role=\"status\" style=\"background: #FBF0DC; color: #5C3B09; border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.5\">Role <strong>{{ peranLabel }}</strong> tidak membuka halaman ini. Isi halaman di samping adalah tampilan Moderator.</div>\n  </template>\n  <template v-for=\"(g, $index) in groups\">\n    <div style=\"display: flex; flex-direction: column; gap: 2px\">\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6A64; padding: 0 10px 6px\">{{ g.label }}</div>\n      <template v-for=\"(it, $index) in g.items\">\n        <a :href=\"it.href\" :style=\"it.style\"><span>{{ it.label }}</span><template v-if=\"it.tag\"><span style=\"font-size: 10px; font-weight: 600; color: #55605A; border: 1px solid #DDE3DF; border-radius: 999px; padding: 1px 6px; white-space: nowrap\">{{ it.tag }}</span></template></a>\n      </template>\n    </div>\n  </template>\n  <div style=\"margin-top: auto; border-top: 1px solid #DDE3DF; padding-top: 14px; display: flex; align-items: center; gap: 10px; padding-left: 8px\">\n    <span style=\"width: 34px; height: 34px; border-radius: 999px; background: #E3EFE8; color: #14533C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px\">{{ inisial }}</span>\n    <span style=\"display: flex; flex-direction: column; font-size: 13px\"><span style=\"font-weight: 600\">{{ pengguna }}</span><a href=\"index.html\" style=\"color: #1F6B4F\">Keluar</a></span>\n  </div>\n</nav>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    let peran = 'moderator';
    try { peran = window.localStorage.getItem('hisada.peran') || 'moderator'; } catch (e) {}
    this.state = { peran };
  }
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-decoration: none; ';
    const on = base + 'background: #E3EFE8; color: #14533C; font-weight: 600';
    const off = base + 'color: #2E3833';
    // Peta akses README: '' = penuh · 'akses' = jika diberi lewat Manajemen Akses · 'lihat' = lihat saja · 'sebagian' = sebagian fitur
    const R = [
      { key: 'moderator', label: 'Moderator', nama: 'Admin pondok (contoh)', inisial: 'MD', ling: 'Semua lingkungan' },
      { key: 'sekretaris', label: 'Sekretaris', nama: 'Santri Contoh 63 · Sekretaris', inisial: 'SK', ling: 'Putra' },
      { key: 'piket', label: 'Piket', nama: 'Santri Contoh 61 · Piket', inisial: 'PK', ling: 'Putra' },
      { key: 'kesehatan', label: 'Kesehatan', nama: 'Santri Contoh 62 · Kesehatan', inisial: 'KS', ling: 'Putra' },
      { key: 'kedisiplinan', label: 'Kedisiplinan', nama: 'Santri Contoh 64 · Kedisiplinan', inisial: 'KD', ling: 'Putra' },
      { key: 'asatidz', label: 'Asatidz (guru)', nama: '[Nama guru] · Asatidz', inisial: 'GR', ling: 'Putra (diatur Moderator)' }
    ];
    const M = {
      dashboard: { moderator: '', sekretaris: '', piket: '', kesehatan: '', kedisiplinan: '', asatidz: '' },
      datamaster: { moderator: '' },
      absensi: { moderator: '', sekretaris: '', piket: '', kesehatan: 'akses', kedisiplinan: 'akses', asatidz: 'lihat' },
      perizinan: { moderator: '', piket: 'akses', asatidz: 'lihat' },
      kesehatan: { moderator: '', kesehatan: 'akses' },
      kedisiplinan: { moderator: '', kedisiplinan: 'akses', asatidz: 'lihat / akses' },
      pd: { moderator: '', sekretaris: '', asatidz: 'lihat' },
      rapor: { moderator: '', sekretaris: '', asatidz: 'lihat' },
      tw: { moderator: '', sekretaris: '', piket: 'lihat', kesehatan: 'lihat', kedisiplinan: 'lihat', asatidz: 'lihat' },
      updatedata: { moderator: '', sekretaris: 'bagian pengurus' },
      akses: { moderator: '' },
      riwayat: { moderator: '', sekretaris: 'masa jabatan' }
    };
    const peran = M.dashboard[this.state.peran] === undefined ? 'moderator' : this.state.peran;
    const role = R.find((r) => r.key === peran);
    const mk = (key, label, href) => {
      const tag = M[key][peran];
      return tag === undefined ? null : { label, href, tag: tag === 'akses' ? 'jika diberi akses' : tag, style: key === active ? on : off };
    };
    const grp = (label, items) => ({ label, items: items.filter(Boolean) });
    return {
      perans: R.map((r) => ({ key: r.key, label: r.label, on: r.key === peran })),
      pickPeran: (e) => {
        const v = e.target.value;
        try { window.localStorage.setItem('hisada.peran', v); } catch (err) {}
        this.setState({ peran: v });
        try { window.location.reload(); } catch (err) {}
      },
      peranLabel: role.label, pengguna: role.nama, inisial: role.inisial, lingkungan: role.ling,
      blocked: M[active] && M[active][peran] === undefined,
      groups: [
        grp('Beranda', [mk('dashboard', 'Dashboard', 'Dashboard.html')]),
        grp('Administrasi', [
          mk('datamaster', 'Data Master', 'DataMaster.html'),
          mk('absensi', 'Absensi', 'Absensi.html'),
          mk('perizinan', 'Perizinan', 'Perizinan.html'),
          mk('kesehatan', 'Kesehatan', 'Kesehatan.html'),
          mk('kedisiplinan', 'Kedisiplinan', 'Kedisiplinan.html'),
          mk('pd', 'Pengembangan Diri', 'PengembanganDiri.html'),
          mk('rapor', 'Rapor Kesantrian', 'Rapor.html'),
          mk('tw', 'Tata Warkat', 'TataWarkat.html')
        ]),
        grp('Fungsi', [
          mk('updatedata', 'Update Data & Import', 'UpdateData.html'),
          mk('akses', 'Manajemen Akses', 'ManajemenAkses.html'),
          mk('riwayat', 'Riwayat Perubahan', 'Riwayat.html')
        ])
      ].filter((g) => g.items.length)
    };
  }
}

return Component; })() };
DCMount("ManajemenAkses", DEFS);
</script>
</body>
