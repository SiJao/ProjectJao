\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; overflow-x: auto\">\n      <table style=\"width: 100%; border-collapse: collapse; font-size: 14px; min-width: 680px\">\n        <thead>\n          <tr style=\"text-align: left; color: #55605A; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em\">\n            <template v-for=\"(c, $index) in cols\">\n              <th style=\"padding: 12px 18px; border-bottom: 1px solid #DDE3DF\">{{ c }}</th>\n            </template>\n          </tr>\n        </thead>\n        <tbody>\n          <template v-for=\"(r, $index) in rows\">\n            <tr>\n              <template v-for=\"(cell, $index) in r.cells\">\n                <td style=\"padding: 11px 18px; border-bottom: 1px solid #EEF1EF\">{{ cell }}</td>\n              </template>\n            </tr>\n          </template>\n        </tbody>\n      </table>\n    </section>\n    <p style=\"margin: 0; font-size: 13px; color: #55605A; line-height: 1.5\">{{ footnote }}</p>\n  </main>\n</div>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

: #14533C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px\">SK</span>\n    <span style=\"display: flex; flex-direction: column; font-size: 13px\"><span style=\"font-weight: 600\">Sekretaris (contoh)</span><a href=\"index.html\" style=\"color: #1F6B4F\">Keluar</a></span>\n  </div>\n</nav>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: block; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-decoration: none; ';
    const on = base + 'background: #E3EFE8; color: #14533C; font-weight: 600';
    const off = base + 'color: #2E3833';
    const mk = (key, label, href) => ({ label, href, live: !!href, soon: !href, style: key === active ? on : off });
    return {
      groups: [
        { label: 'Beranda', items: [mk('dashboard', 'Dashboard', 'Dashboard.html')] },
