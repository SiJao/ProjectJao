EF1EF\">{{ r.kelas }}</td>\n              <td style=\"padding: 8px 16px; border-bottom: 1px solid #EEF1EF\">\n                <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n                  <select :aria-label=\"r.label\" @change=\"r.change\" :disabled=\"r.locked\" :style=\"r.selStyle\">\n                    <template v-for=\"(o, $index) in r.opts\">\n                      <option :value=\"o.code\" :selected=\"o.on\">{{ o.full }}</option>\n                    </template>\n                  </select>\n                  <template v-if=\"r.locked\">\n                    <span style=\"font-size: 12px; color: #55605A\">{{ r.source }}</span>\n                  </template>\n                </div>\n              </td>\n            </tr>\n          </template>\n        </tbody>\n      </table>\n      <template v-if=\"kosong\">\n        <p style=\"margin: 0; padding: 16px; font-size: 14px; color: #55605A\">Data contoh hanya tersedia untuk kamar Ibnu Rusyd-01.</p>\n      </template>\n    </section>\n    <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px\">\n      <span style=\"font-size: 13px; color: #55605A; line-height: 1.5\">Daftar sesi dan status kehadiran diatur di Data Master › Daftar Pilihan. Status otomatis terkunci; urutan: skorsing › perizinan/overdue › kesehatan › isian manual.</span>\n      <button type=\"button\" style=\"height: 46px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; border: 0; padding: 0 22px; font: inherit; font-weight: 600; cursor: pointer\">Simpan absensi</button>\n    </div>\n  </main>\n</div>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  constructor(props) {

  renderVals() {
    const tab = (on) => 'height: 40px; border-radius: 999px; padding: 0 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #1F6B4F; color: #FFFFFF; border: 1px solid #1F6B4F' : 'background: #FFFFFF; color: #2E3833; border: 1px solid #C9D2CC');

    const codes = ['H', 'I', 'S', 'A', 'P'];
    // Semua penghuni Ibnu Rusyd-01 (sesuai Data Master), Senin 26/10/2026
    const people = [
      [1, '990101', 'Santri Contoh 01', '1 A MTs'], [2, '990102', 'Santri Contoh 02', '1 A MTs'],
      [3, '990306', 'Santri Contoh 06', '3 D SMP', 'otomatis: skorsing'], [4, '990213', 'Santri Contoh 13', '2 B MTs', 'otomatis: izin Pulang s.d. 29/10'],

    const AS = {

      return ns.map((n) => {

    const kamarList = AS[this.state.asrama] || AS['Ibnu Rusyd'];
    const kamar = kamarList.includes(this.state.kamar) ? this.state.kamar : kamarList[0];
    const keg = KEG.includes(this.state.kegiatan) ? this.state.kegiatan : 'Pramuka';
    const grupList = grupOf(keg);
    const grup = grupList.includes(this.state.grup) ? this.state.grup : grupList[0];
    const st = this.state.st;

          if (harian) this.setState({ st: { ...st, [id]: v } });

    });

    const val = (e) => (e && e.target ? e.target.value : '');
    return {
      title: harian ? 'Absensi Harian' : 'Absensi Kegiatan',

      harianStyle: tab(harian), kegiatanStyle: tab(!harian),
      modeHarian: () => this.setState({ mode: 'harian' }),
      modeKegiatan: () => this.setState({ mode: 'kegiatan' }),
      allHadir: () => {
        if (harian) this.setState({ st: { ...st, 1: 'H', 2: 'H', 6: 'H', 7: 'H', 8: 'H' } });
        else { const nx = { ...stK }; list.forEach((r) => { nx[gk + r[0]] = 'H'; }); this.setState({ stK: nx }); }
      },
      asramaOpts: Object.keys(AS).map((v) => ({ v, on: v === this.state.asrama })),
      kamarOpts: kamarList.map((v) => ({ v, on: v === kamar })),
      kegiatanOpts: KEG.map((v) => ({ v, on: v === keg })),
      grupOpts: grupList.map((v) => ({ v, on: v === grup })),
      pickAsrama: (e) => { const v = val(e); if (AS[v]) this.setState({ asrama: v, kamar: AS[v][0] }); },
      pickKamar: (e) => { const v = val(e); if (kamarList.includes(v)) this.setState({ kamar: v }); },
      pickKegiatan: (e) => { const v = val(e); if (KEG.includes(v)) this.setState({ kegiatan: v, grup: grupOf(v)[0] }); },
      pickGrup: (e) => { const v = val(e); if (grupList.includes(v)) this.setState({ grup: v }); },
      kosong: rows.length === 0,
      daftarNote: harian ? 'Penghuni kamar ' + kamar + ' · ' + rows.length + ' santri' : 'Anggota ' + keg + ' · ' + grup + ' · ' + rows.length + ' santri (daftar anggota grup, bukan penghuni kamar)',
      chips, rows
    };
  }
}

return Component; })() };

      perizinan: { moderator: '', piket: 'akses', asatidz: 'lihat' },

    };

    return {
