<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HISADA · Absensi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
a{color:#1F6B4F}a:hover{color:#14533C}
</style>
</head>
<body>
<div id="app"></div>
<script src="vue.global.prod.js"></script>
<script src="dc-shim.js"></script>
<script>
var DEFS = {};
DEFS["Absensi"] = { props: [], template: "<div style=\"display: flex; flex-wrap: wrap; min-height: 900px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; background: #F4F6F4\">\n  <div style=\"flex: 1 1 248px; max-width: 100%\">\n    <sidebar-c active=\"absensi\"></sidebar-c>\n  </div>\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n    <header style=\"display: flex; flex-direction: column; gap: 4px\">\n      <span style=\"font-size: 13px; color: #55605A\">Administrasi › Kesantrian</span>\n      <h1 style=\"margin: 0; font-size: 28px; font-weight: 700\">{{ title }}</h1>\n    </header>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 8px\" role=\"group\" aria-label=\"Jenis absensi\">\n      <button type=\"button\" @click=\"modeHarian\" :style=\"harianStyle\">Harian (per kamar)</button>\n      <button type=\"button\" @click=\"modeKegiatan\" :style=\"kegiatanStyle\">Kegiatan (per grup)</button>\n    </div>\n\n    <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end\">\n      <template v-if=\"isHarian\">\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Asrama\n        <select style=\"height: 44px; min-width: 200px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Ibnu Rusyd</option><option>Ibnu Sina</option><option>Kholid Bin Walid</option></select>\n      </label>\n      <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Kamar\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n          <template v-for=\"(k, $index) in kamars\">\n            <button type=\"button\" @click=\"k.pick\" :style=\"k.style\">{{ k.label }}</button>\n          </template>\n        </div>\n      </div>\n      </template>\n      <template v-if=\"isKegiatan\">\n      <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Kegiatan\n        <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n          <template v-for=\"(g, $index) in kegiatan\">\n            <button type=\"button\" @click=\"g.pick\" :style=\"g.style\">{{ g.label }}</button>\n          </template>\n        </div>\n      </div>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Grup\n        <select style=\"height: 44px; min-width: 160px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\"><option>Grup 1</option><option>Grup 2</option><option>Grup 3</option></select>\n      </label>\n      </template>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Tanggal\n        <input type=\"date\" value=\"2026-10-26\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400\">\n      </label>\n      <button type=\"button\" @click=\"allHadir\" style=\"height: 44px; margin-left: auto; border: 1px solid #1F6B4F; color: #1F6B4F; background: #FFFFFF; border-radius: 10px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer\">Tandai semua hadir</button>\n    </section>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px\">\n      <span style=\"background: #E3F1E9; color: #1E5E3F; border-radius: 999px; padding: 6px 12px; font-weight: 600\">Hadir {{ count.H }}</span>\n      <span style=\"background: #E4ECF8; color: #23497E; border-radius: 999px; padding: 6px 12px; font-weight: 600\">Izin {{ count.I }}</span>\n      <span style=\"background: #FBF0DC; color: #7A4E0C; border-radius: 999px; padding: 6px 12px; font-weight: 600\">Sakit {{ count.S }}</span>\n      <span style=\"background: #F9E3E1; color: #8E2A22; border-radius: 999px; padding: 6px 12px; font-weight: 600\">Alpha {{ count.A }}</span>\n    </div>\n\n    <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; overflow-x: auto\">\n      <table style=\"width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px\">\n        <thead>\n          <tr style=\"text-align: left; color: #55605A; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em\">\n            <th style=\"padding: 12px 16px; border-bottom: 1px solid #DDE3DF\">NIS</th>\n            <th style=\"padding: 12px 16px; border-bottom: 1px solid #DDE3DF\">Nama</th>\n            <th style=\"padding: 12px 16px; border-bottom: 1px solid #DDE3DF\">Kelas</th>\n            <th style=\"padding: 12px 16px; border-bottom: 1px solid #DDE3DF\">Status</th>\n          </tr>\n        </thead>\n        <tbody>\n          <template v-for=\"(r, $index) in rows\">\n            <tr>\n              <td style=\"padding: 10px 16px; border-bottom: 1px solid #EEF1EF; color: #55605A\">{{ r.nis }}</td>\n              <td style=\"padding: 10px 16px; border-bottom: 1px solid #EEF1EF; font-weight: 600\">{{ r.nama }}</td>\n              <td style=\"padding: 10px 16px; border-bottom: 1px solid #EEF1EF\">{{ r.kelas }}</td>\n              <td style=\"padding: 8px 16px; border-bottom: 1px solid #EEF1EF\">\n                <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center\">\n                  <template v-for=\"(o, $index) in r.opts\">\n                    <button type=\"button\" @click=\"o.pick\" :disabled=\"r.locked\" :aria-pressed=\"o.on\" :aria-label=\"o.full\" :style=\"o.style\">{{ o.code }}</button>\n                  </template>\n                  <template v-if=\"r.locked\">\n                    <span style=\"font-size: 12px; color: #55605A\">otomatis dari {{ r.source }}</span>\n                  </template>\n                </div>\n              </td>\n            </tr>\n          </template>\n        </tbody>\n      </table>\n    </section>\n    <div style=\"display: flex; justify-content: flex-end; gap: 10px\">\n      <button type=\"button\" style=\"height: 46px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; border: 0; padding: 0 22px; font: inherit; font-weight: 600; cursor: pointer\">Simpan absensi</button>\n    </div>\n  </main>\n</div>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      mode: 'harian', kamar: '01', keg: 'Pramuka',
      st: { 1: 'H', 2: 'H', 3: 'I', 4: 'H', 5: 'S', 6: 'H', 7: 'A', 8: 'H' }
    };
  }
  renderVals() {
    const tab = (on) => 'height: 40px; border-radius: 999px; padding: 0 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #1F6B4F; color: #FFFFFF; border: 1px solid #1F6B4F' : 'background: #FFFFFF; color: #2E3833; border: 1px solid #C9D2CC');
    const chip = (on) => 'height: 44px; min-width: 52px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; ' + (on ? 'background: #E3EFE8; color: #14533C; border: 1px solid #1F6B4F' : 'background: #FFFFFF; color: #2E3833; border: 1px solid #C9D2CC');
    const colors = { H: ['#E3F1E9', '#1E5E3F'], I: ['#E4ECF8', '#23497E'], S: ['#FBF0DC', '#7A4E0C'], A: ['#F9E3E1', '#8E2A22'] };
    const full = { H: 'Hadir', I: 'Izin', S: 'Sakit', A: 'Alpha' };
    const people = [
      [1, '990101', 'Santri Contoh 01', '1 A MTs'], [2, '990102', 'Santri Contoh 02', '1 A MTs'],
      [3, '990203', 'Santri Contoh 03', '2 B MTs', 'Perizinan'], [4, '990204', 'Santri Contoh 04', '2 C SMP'],
      [5, '990305', 'Santri Contoh 05', '3 A MTs', 'Kesehatan'], [6, '990306', 'Santri Contoh 06', '3 D SMP'],
      [7, '990407', 'Santri Contoh 07', '4 B'], [8, '990408', 'Santri Contoh 08', '4 B']
    ];
    const st = this.state.st;
    const count = { H: 0, I: 0, S: 0, A: 0 };
    Object.values(st).forEach((v) => { count[v]++; });
    const rows = people.map(([id, nis, nama, kelas, source]) => ({
      nis, nama, kelas, source: source || '', locked: !!source,
      opts: ['H', 'I', 'S', 'A'].map((c) => {
        const on = st[id] === c;
        return {
          code: c, full: full[c] + ' untuk ' + nama, on,
          style: 'width: 44px; height: 36px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' + (on ? 'background: ' + colors[c][0] + '; color: ' + colors[c][1] + '; border: 1px solid ' + colors[c][1] : 'background: #FFFFFF; color: #5F6A64; border: 1px solid #DDE3DF'),
          pick: () => this.setState({ st: { ...st, [id]: c } })
        };
      })
    }));
    return {
      harianStyle: tab(this.state.mode === 'harian'),
      kegiatanStyle: tab(this.state.mode === 'kegiatan'),
      modeHarian: () => this.setState({ mode: 'harian' }),
      modeKegiatan: () => this.setState({ mode: 'kegiatan' }),
      kamars: ['01', '02', '03', '04'].map((k) => ({ label: k, style: chip(this.state.kamar === k), pick: () => this.setState({ kamar: k }) })),
      allHadir: () => this.setState({ st: { ...st, 1: 'H', 2: 'H', 4: 'H', 6: 'H', 7: 'H', 8: 'H' } }),
      count, rows,
      isHarian: this.state.mode === 'harian', isKegiatan: this.state.mode === 'kegiatan',
      title: this.state.mode === 'harian' ? 'Absensi Harian' : 'Absensi Kegiatan',
      kegiatan: ['Pramuka', 'Muhadhoroh', 'Halaqah Qur\x27an', 'Olahraga', 'Kesenian'].map((g) => ({ label: g, style: chip(this.state.keg === g).replace('min-width: 52px', 'padding: 0 14px'), pick: () => this.setState({ keg: g }) }))
    };
  }
}

return Component; })() };
DEFS["Sidebar"] = { props: ["active"], template: "<nav aria-label=\"Menu utama\" style=\"width: 100%; min-height: 900px; background: #FFFFFF; border-right: 1px solid #DDE3DF; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; box-sizing: border-box\">\n  <a href=\"Dashboard.html\" style=\"display: flex; align-items: center; gap: 10px; padding: 4px 8px; text-decoration: none; color: #18201C\">\n    <span style=\"width: 36px; height: 36px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700\">H</span>\n    <span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 700; font-size: 16px\">HISADA</span><span style=\"font-size: 12px; color: #55605A\">Putra · 2026/2027</span></span>\n  </a>\n  <template v-for=\"(g, $index) in groups\">\n    <div style=\"display: flex; flex-direction: column; gap: 2px\">\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6A64; padding: 0 10px 6px\">{{ g.label }}</div>\n      <template v-for=\"(it, $index) in g.items\">\n        <template v-if=\"it.live\">\n          <a :href=\"it.href\" :style=\"it.style\">{{ it.label }}</a>\n        </template>\n        <template v-if=\"it.soon\">\n          <span style=\"display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-radius: 8px; font-size: 14px; color: #6B756F\">{{ it.label }}<span style=\"font-size: 11px; border: 1px solid #DDE3DF; border-radius: 999px; padding: 1px 7px\">nanti</span></span>\n        </template>\n      </template>\n    </div>\n  </template>\n  <div style=\"margin-top: auto; border-top: 1px solid #DDE3DF; padding-top: 14px; display: flex; align-items: center; gap: 10px; padding-left: 8px\">\n    <span style=\"width: 34px; height: 34px; border-radius: 999px; background: #E3EFE8; color: #14533C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px\">SK</span>\n    <span style=\"display: flex; flex-direction: column; font-size: 13px\"><span style=\"font-weight: 600\">Sekretaris (contoh)</span><a href=\"index.html\" style=\"color: #1F6B4F\">Keluar</a></span>\n  </div>\n</nav>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: block; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-decoration: none; ';
    const on = base + 'background: #E3EFE8; color: #14533C; font-weight: 600';
    const off = base + 'color: #2E3833';
    const mk = (key, label, href) => ({ label, href, live: !!href, soon: !href, style: key === active ? on : off });
    return {
      groups: [
        { label: 'Beranda', items: [mk('dashboard', 'Dashboard', 'Dashboard.html')] },
        { label: 'Administrasi', items: [
          mk('datamaster', 'Data Master', 'DataMaster.html'),
          mk('absensi', 'Absensi', 'Absensi.html'),
          mk('perizinan', 'Perizinan', 'Perizinan.html'),
          mk('kesehatan', 'Kesehatan', 'Kesehatan.html'),
          mk('kedisiplinan', 'Kedisiplinan', 'Kedisiplinan.html'),
          mk('pd', 'Pengembangan Diri', 'PengembanganDiri.html'),
          mk('rapor', 'Rapor Kesantrian', 'Rapor.html'),
          mk('tw', 'Tata Warkat', 'TataWarkat.html')
        ] },
        { label: 'Fungsi', items: [
          mk('updatedata', 'Update Data & Import', 'UpdateData.html'),
          mk('akses', 'Manajemen Akses', 'ManajemenAkses.html'),
          mk('riwayat', 'Riwayat Perubahan', 'Riwayat.html')
        ] }
      ]
    };
  }
}

return Component; })() };
DCMount("Absensi", DEFS);
</script>
</body>
</html>
