<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HISADA · Perizinan</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#18201C}
*{box-sizing:border-box}
a{color:#1F6B4F}a:hover{color:#14533C}
</style>
</head>
<body>
<div id="app"></div>
<script src="vue.global.prod.js"></script>
<script src="dc-shim.js"></script>
<script>
var DEFS = {};
DEFS["Perizinan"] = { props: [], template: "<div style=\"display: flex; flex-wrap: wrap; min-height: 900px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; background: #F4F6F4\">\n  <div style=\"flex: 1 1 248px; max-width: 100%\">\n    <sidebar-c active=\"perizinan\"></sidebar-c>\n  </div>\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 20px\">\n    <header style=\"display: flex; flex-direction: column; gap: 4px\">\n      <span style=\"font-size: 13px; color: #55605A\">Administrasi › Kesantrian</span>\n      <h1 style=\"margin: 0; font-size: 28px; font-weight: 700\">Perizinan &amp; Gate Pass</h1>\n    </header>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n      <section style=\"flex: 1 1 360px; min-width: 0; background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n        <h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Terbitkan izin</h2>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Santri\n          <input type=\"search\" value=\"Santri Contoh 03 · 990203\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400\">\n        </label>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Jenis izin\n          <select aria-label=\"Jenis izin\" @change=\"pickJenis\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400; background: #FFFFFF\">\n            <template v-for=\"(j, $index) in jenis\">\n              <option :value=\"j.key\" :selected=\"j.on\">{{ j.label }}</option>\n            </template>\n          </select>\n          <span style=\"font-weight: 400; color: #55605A\">{{ jenisNote }}</span>\n        </div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n          <label style=\"flex: 1 1 140px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Berangkat\n            <input type=\"text\" :value=\"dep\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400\">\n          </label>\n          <label style=\"flex: 1 1 140px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Kembali\n            <input type=\"text\" :value=\"ret\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400\">\n          </label>\n        </div>\n        <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600\">Keterangan\n          <input type=\"text\" value=\"Berobat ke klinik\" style=\"height: 44px; border: 1px solid #C9D2CC; border-radius: 10px; padding: 0 12px; font: inherit; font-weight: 400\">\n        </label>\n        <button type=\"button\" style=\"height: 46px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; border: 0; font: inherit; font-weight: 600; cursor: pointer\">Terbitkan &amp; cetak Gate Pass</button>\n        <p style=\"margin: 0; font-size: 12px; color: #55605A; line-height: 1.5\">Absensi otomatis menjadi Izin/Pulang. Wali menerima kabar per kejadian.</p>\n      </section>\n\n      <section aria-label=\"Pratinjau Gate Pass\" style=\"flex: 1 1 320px; min-width: 0; background: #FFFFFF; border: 1px solid #C9D2CC; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; font-size: 13px\">\n        <div style=\"display: flex; gap: 12px; align-items: center; border-bottom: 2px solid #18201C; padding-bottom: 12px\">\n          <div style=\"width: 40px; height: 40px; border-radius: 999px; border: 2px solid #1F6B4F; color: #1F6B4F; display: flex; align-items: center; justify-content: center; font-weight: 700\">DU</div>\n          <div style=\"display: flex; flex-direction: column; gap: 2px\"><strong style=\"font-size: 14px\">Pesantren Modern Daarul 'Uluum Lido</strong><span style=\"color: #55605A\">SEKRETARIS HISADA</span></div>\n        </div>\n        <div style=\"text-align: center; font-weight: 700; letter-spacing: 0.12em; font-size: 15px\">GATE PASS · {{ jenisLabel }}</div>\n        <div style=\"display: grid; grid-template-columns: 120px 1fr; row-gap: 8px\">\n          <span style=\"color: #55605A\">Name</span><span style=\"font-weight: 600\">Santri Contoh 03</span>\n          <span style=\"color: #55605A\">Class / Room</span><span>2 B MTs · Ibnu Rusyd-02</span>\n          <span style=\"color: #55605A\">Reason</span><span>Berobat ke klinik</span>\n          <span style=\"color: #55605A\">Departure</span><span>{{ dep }}</span>\n          <span style=\"color: #55605A\">Return</span><span>{{ ret }}</span>\n        </div>\n        <div style=\"display: flex; justify-content: space-between; gap: 16px; padding-top: 28px; text-align: center; color: #55605A\">\n          <span style=\"flex: 1; border-top: 1px solid #8A948E; padding-top: 6px\">Security Department</span>\n          <span style=\"flex: 1; border-top: 1px solid #8A948E; padding-top: 6px\">Dormitory Guardian</span>\n        </div>\n      </section>\n    </div>\n\n    <section style=\"background: #FFFFFF; border: 1px solid #DDE3DF; border-radius: 14px; overflow-x: auto\">\n      <div style=\"padding: 16px 20px 8px; display: flex; justify-content: space-between; align-items: center\"><h2 style=\"margin: 0; font-size: 17px; font-weight: 700\">Izin berjalan</h2><span style=\"font-size: 12px; color: #55605A\">overdue → Alpha + pelanggaran otomatis</span></div>\n      <table style=\"width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px\">\n        <thead>\n          <tr style=\"text-align: left; color: #55605A; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em\">\n            <th style=\"padding: 10px 20px; border-bottom: 1px solid #DDE3DF\">Santri</th>\n            <th style=\"padding: 10px 20px; border-bottom: 1px solid #DDE3DF\">Jenis</th>\n            <th style=\"padding: 10px 20px; border-bottom: 1px solid #DDE3DF\">Kembali</th>\n            <th style=\"padding: 10px 20px; border-bottom: 1px solid #DDE3DF\">Status</th>\n            <th style=\"padding: 10px 20px; border-bottom: 1px solid #DDE3DF\"><span style=\"position: absolute; left: -9999px\">Aksi</span></th>\n          </tr>\n        </thead>\n        <tbody>\n          <template v-for=\"(z, $index) in izin\">\n            <tr>\n              <td style=\"padding: 10px 20px; border-bottom: 1px solid #EEF1EF; font-weight: 600\">{{ z.nama }}</td>\n              <td style=\"padding: 10px 20px; border-bottom: 1px solid #EEF1EF\">{{ z.jenis }}</td>\n              <td style=\"padding: 10px 20px; border-bottom: 1px solid #EEF1EF\">{{ z.ret }}</td>\n              <td style=\"padding: 10px 20px; border-bottom: 1px solid #EEF1EF\"><span :style=\"z.badge\">{{ z.status }}</span></td>\n              <td style=\"padding: 6px 20px; border-bottom: 1px solid #EEF1EF; text-align: right\">\n                <template v-if=\"z.open\">\n                  <button type=\"button\" @click=\"z.back\" style=\"height: 36px; border-radius: 8px; border: 1px solid #1F6B4F; background: #FFFFFF; color: #1F6B4F; font: inherit; font-size: 13px; font-weight: 600; padding: 0 12px; cursor: pointer\">Konfirmasi kembali</button>\n                </template>\n              </td>\n            </tr>\n          </template>\n        </tbody>\n      </table>\n    </section>\n  </main>\n</div>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { jenis: 'keluar', back: {} };
  }
  renderVals() {
    const J = {
      keluar: { label: 'Keluar Sementara', note: 'Jam saja, mulai otomatis dari jam input.', dep: '13.10', ret: '15.00' },
      dinas: { label: 'Izin Dinas', note: 'Tanggal + jam, bisa lintas hari.', dep: '26/10 13.10', ret: '27/10 17.00' },
      pulang: { label: 'Pulang', note: 'Rentang tanggal. Wali wajib mendampingi.', dep: '26/10/2026', ret: '29/10/2026' }
    };
    const cur = J[this.state.jenis];
    const pill = (on) => 'height: 40px; border-radius: 999px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #1F6B4F; color: #FFFFFF; border: 1px solid #1F6B4F' : 'background: #FFFFFF; color: #2E3833; border: 1px solid #C9D2CC');
    const badge = (bg, fg) => 'display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; background: ' + bg + '; color: ' + fg;
    const list = [
      { id: 1, nama: 'Santri Contoh 11', jenis: 'Keluar Sementara', ret: '12.30', over: true },
      { id: 2, nama: 'Santri Contoh 12', jenis: 'Keluar Sementara', ret: '15.00' },
      { id: 3, nama: 'Santri Contoh 13', jenis: 'Pulang', ret: '29/10/2026' },
      { id: 4, nama: 'Santri Contoh 14', jenis: 'Izin Dinas', ret: '27/10 17.00' }
    ];
    return {
      pickJenis: (e) => { if (J[e.target.value]) this.setState({ jenis: e.target.value }); },
      jenis: Object.keys(J).map((k) => ({ key: k, label: J[k].label, on: this.state.jenis === k, style: pill(this.state.jenis === k), pick: () => this.setState({ jenis: k }) })),
      jenisNote: cur.note, jenisLabel: cur.label.toUpperCase(), dep: cur.dep, ret: cur.ret,
      izin: list.map((z) => {
        const done = !!this.state.back[z.id];
        return {
          ...z, open: !done,
          status: done ? 'Kembali' : (z.over ? 'Overdue' : 'Berjalan'),
          badge: done ? badge('#E3F1E9', '#1E5E3F') : (z.over ? badge('#F9E3E1', '#8E2A22') : badge('#E4ECF8', '#23497E')),
          back: () => this.setState({ back: { ...this.state.back, [z.id]: true } })
        };
      })
    };
  }
}

return Component; })() };
DEFS["Sidebar"] = { props: ["active"], template: "<nav aria-label=\"Menu utama\" style=\"width: 100%; min-height: 900px; background: #FFFFFF; border-right: 1px solid #DDE3DF; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #18201C; box-sizing: border-box\">\n  <a href=\"Dashboard.html\" style=\"display: flex; align-items: center; gap: 10px; padding: 4px 8px; text-decoration: none; color: #18201C\">\n    <span style=\"width: 36px; height: 36px; border-radius: 10px; background: #1F6B4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700\">H</span>\n    <span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 700; font-size: 16px\">HISADA</span><span style=\"font-size: 12px; color: #55605A\">Putra · 2026/2027</span></span>\n  </a>\n  <template v-for=\"(g, $index) in groups\">\n    <div style=\"display: flex; flex-direction: column; gap: 2px\">\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5F6A64; padding: 0 10px 6px\">{{ g.label }}</div>\n      <template v-for=\"(it, $index) in g.items\">\n        <template v-if=\"it.live\">\n          <a :href=\"it.href\" :style=\"it.style\">{{ it.label }}</a>\n        </template>\n        <template v-if=\"it.soon\">\n          <span style=\"display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-radius: 8px; font-size: 14px; color: #6B756F\">{{ it.label }}<span style=\"font-size: 11px; border: 1px solid #DDE3DF; border-radius: 999px; padding: 1px 7px\">nanti</span></span>\n        </template>\n      </template>\n    </div>\n  </template>\n  <div style=\"margin-top: auto; border-top: 1px solid #DDE3DF; padding-top: 14px; display: flex; align-items: center; gap: 10px; padding-left: 8px\">\n    <span style=\"width: 34px; height: 34px; border-radius: 999px; background: #E3EFE8; color: #14533C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px\">SK</span>\n    <span style=\"display: flex; flex-direction: column; font-size: 13px\"><span style=\"font-weight: 600\">Sekretaris (contoh)</span><a href=\"index.html\" style=\"color: #1F6B4F\">Keluar</a></span>\n  </div>\n</nav>", Cls: (function(){ class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(){} forceUpdate(){} }

class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display: block; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-decoration: none; ';
    const on = base + 'background: #E3EFE8; color: #14533C; font-weight: 600';
    const off = base + 'color: #2E3833';
    const mk = (key, label, href) => ({ label, href, live: !!href, soon: !href, style: key === active ? on : off });
    return {
      groups: [
        { label: 'Beranda', items: [mk('dashboard', 'Dashboard', 'Dashboard.html')] },
        { label: 'Administrasi', items: [
          mk('datamaster', 'Data Master', 'DataMaster.html'),
          mk('absensi', 'Absensi', 'Absensi.html'),
          mk('perizinan', 'Perizinan', 'Perizinan.html'),
          mk('kesehatan', 'Kesehatan', 'Kesehatan.html'),
          mk('kedisiplinan', 'Kedisiplinan', 'Kedisiplinan.html'),
          mk('pd', 'Pengembangan Diri', 'PengembanganDiri.html'),
          mk('rapor', 'Rapor Kesantrian', 'Rapor.html'),
          mk('tw', 'Tata Warkat', 'TataWarkat.html')
        ] },
        { label: 'Fungsi', items: [
          mk('updatedata', 'Update Data & Import', 'UpdateData.html'),
          mk('akses', 'Manajemen Akses', 'ManajemenAkses.html'),
          mk('riwayat', 'Riwayat Perubahan', 'Riwayat.html')
        ] }
      ]
    };
  }
}

return Component; })() };
DCMount("Perizinan", DEFS);
</script>
</body>
</html>
