<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Countdown to 15 November 2025</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="countdown-container">
    <h1>Countdown Menuju 15 November 2025</h1>
    <div class="countdown" id="countdown">
      <span id="days">00</span> Hari
      <span id="hours">00</span> Jam
      <span id="minutes">00</span> Menit
      <span id="seconds">00</span> Detik
    </div>
    <p id="finished" style="display:none;">Waktu telah tiba!</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
