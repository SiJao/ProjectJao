<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Elegant Countdown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="countdown-container">
    <h1>Countdown</h1>
    <!-- Default waktu ditentukan di input -->
    <div>
      <label for="target-time">Countdown to:</label>
      <input type="datetime-local" id="target-time" value="2025-12-31T23:59">
      <button id="start-btn">Start</button>
    </div>
    <div class="countdown" id="countdown">
      <span id="days">00</span>d :
      <span id="hours">00</span>h :
      <span id="minutes">00</span>m :
      <span id="seconds">00</span>s
    </div>
    <p id="finished" style="display:none;">Time's up!</p>
  </div>
  <script src="script.js"></script>
</body>
</html>
